<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Token</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg-muted:#ebedf0; --bg-subtle:#f7f8fa; --surface:#fff;
  --border:#e6e8eb; --border-strong:#d9d9d9;
  --brand:#004285; --brand-strong:#091d38; --brand-tint:#eef3fa;
  --strong:#050d18; --muted:#5a6472; --faint:#b9bec4;
  --danger:#b31942; --discard:#b3123a;
  --pos-bg:#e3f4ea; --pos:#1d7a48; --prog-bg:#e6effb; --prog:#2a5db0;
  --neu-bg:#eef0f2; --crit-bg:#fbe8ec; --att-bg:#fdf1dc; --att:#9a5b00;
  --ok-banner:#e6f4ec;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-muted);font-family:"DM Sans",system-ui,sans-serif;color:var(--strong);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}

/* shell */
.top{height:62px;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--brand-strong)}
.brand img{width:22px;height:22px}
.bell{position:relative;width:36px;height:36px;border:0;background:none;border-radius:10px;display:grid;place-items:center}
.bell:hover{background:var(--bg-subtle)}
.bell .dot{position:absolute;left:24px;top:6px;width:7px;height:7px}
.vdiv{width:1px;height:24px;background:var(--border-strong)}
.acct{display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--bg-subtle);display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.who b{display:block;font-weight:600;font-size:14px;line-height:1.5}
.who span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.body{padding:0 20px 20px}
.panel{display:flex;background:var(--bg-subtle);border:1px solid var(--border);border-radius:20px;overflow:hidden;min-height:calc(100vh - 82px)}
.side{width:248px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column}
.side nav{flex:1;padding:12px 0;display:flex;flex-direction:column;gap:4px}
.nav{margin:0 12px;height:37px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:10px;color:var(--muted);position:relative;border:0;background:none;text-align:left;width:calc(100% - 24px)}
.nav:hover{background:var(--bg-muted)}
.nav img{width:16px;height:16px}
.nav.on{background:var(--bg-muted);color:var(--strong);font-weight:600}
.nav.on::before{content:"";position:absolute;left:0;top:8px;width:3px;height:21px;border-radius:6px;background:var(--brand)}
.nav .count{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center;padding:0 4px}
.side .org{border-top:1px solid var(--border);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.glabel{padding:6px 28px 8px;font-size:11px;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--faint)}
.switch{margin:8px 12px 12px;border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.45}
.mono{width:28px;height:28px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.switch b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.switch span{color:var(--muted)}
main{flex:1;min-width:0;padding:32px 32px 64px;display:flex;flex-direction:column;gap:24px}

/* type + bits */
.back{height:32px;display:inline-flex;align-items:center;font-size:13px;font-weight:500;color:var(--brand);border:0;background:none;padding:0;align-self:flex-start}
h1{margin:0;font-size:32px;font-weight:700;line-height:1.2}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.req{color:var(--danger)}
.opt{color:var(--muted);font-weight:500}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-h{padding:20px 24px 16px}
.card-h h2{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.card-b{padding:0 24px 24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid var(--border)}
.grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .d{font-size:12px;color:var(--muted)}
.ico{width:28px;height:28px;border-radius:8px;background:var(--bg-subtle);display:grid;place-items:center;flex:none;color:var(--muted)}
.ico svg{width:16px;height:16px}
.ico.ok{background:var(--pos-bg);color:var(--pos);border-radius:999px}

.btn{height:36px;padding:0 16px;border-radius:10px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--strong);white-space:nowrap}
.btn:hover{background:var(--bg-subtle)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#00356b}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.link{border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--brand)}
.link.danger{color:var(--discard);font-weight:600}
.link:hover{text-decoration:underline}

.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b-pos{background:var(--pos-bg);color:var(--pos)}
.b-prog{background:var(--prog-bg);color:var(--prog)}
.b-neu{background:var(--neu-bg);color:var(--muted)}
.b-crit{background:var(--crit-bg);color:var(--danger)}
.b-att{background:var(--att-bg);color:var(--att)}

.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:500}
.input{height:44px;width:100%;border:1px solid var(--border);border-radius:10px;padding:0 14px;background:var(--surface);font-size:14px}
.input::placeholder{color:var(--muted)}
.input:focus,.select:focus{outline:2px solid #9bb7d6;outline-offset:0;border-color:var(--brand)}
.select{appearance:none;height:44px;width:100%;border:1px solid var(--border);border-radius:10px;padding:0 40px 0 14px;background:var(--surface) url(assets/chevron-down.svg) no-repeat right 14px center/16px;font-size:14px}
.hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}

/* steps */
.steps{display:flex;align-items:center;gap:12px;padding:20px 24px}
.step{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;flex:none}
.step[disabled]{cursor:default}
.dotn{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:600;background:#fff;border:1.5px solid var(--faint);color:var(--muted);flex:none}
.dotn img{width:14px;height:14px}
.step.done .dotn,.step.cur .dotn{background:var(--brand);border-color:var(--brand);color:#fff}
.step .nm{font-size:14px;font-weight:500;color:var(--muted);line-height:1.25}
.step.done .nm{color:var(--strong)}
.step.cur .nm{color:var(--strong);font-weight:600}
.step .meta{font-size:13px;color:var(--muted);line-height:1.25}
.conn{flex:1;height:2px;background:var(--border);min-width:12px}
.conn.on{background:var(--brand)}
.step.done:hover .nm{text-decoration:underline}

.rhead{display:flex;align-items:center;gap:16px}
.rhead img.tk,.rhead .tk{width:56px;height:56px;border-radius:12px;object-fit:cover;flex:none}
.footer{display:flex;align-items:center;gap:12px;padding-top:8px}

/* segmented */
.seg{display:flex;background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{flex:1;height:34px;border:0;border-radius:8px;background:none;font-size:12px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--strong);font-weight:500;box-shadow:0 1px 2px rgba(5,13,24,.08)}

/* options list */
.opt-row{display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.opt-row:hover{background:var(--bg-subtle)}
.opt-row.sel{background:#f3f6fa}
.opt-row.dis{cursor:default;color:var(--faint)}
.opt-row.dis:hover{background:none}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);flex:none;background:#fff}
.sel .radio{border:4px solid var(--brand)}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;background:#fff}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tile{width:32px;height:32px;border-radius:8px;background:var(--bg-subtle);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--strong);flex:none}

/* type cards */
.typecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.typecard{border:1px solid var(--border);border-radius:10px;padding:16px;background:#fff;text-align:left;display:flex;gap:12px}
.typecard.sel{border-color:var(--brand);background:#f3f6fa;box-shadow:inset 0 0 0 1px var(--brand)}
.typecard b{display:block;font-weight:600}

/* upload */
.thumb{width:64px;height:64px;border-radius:12px;border:1px dashed var(--border-strong);background:var(--bg-subtle) center/cover no-repeat;flex:none}
.thumb.has{border-style:solid;border-color:var(--border)}
.drop{border:1px dashed var(--border-strong);border-radius:10px;padding:14px;display:flex;justify-content:center;gap:6px;font-size:13px;background:#fff;cursor:pointer;width:100%}
.drop.over{border-color:var(--brand);background:var(--brand-tint)}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:10px 14px}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:26px;border-radius:999px;background:var(--neu-bg);display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 10px;font-size:12px;font-weight:500}
.chip small{color:var(--muted);font-weight:400}
.chip button{border:0;background:none;color:var(--muted);padding:0 2px;font-size:13px;line-height:1}
.addchip{height:26px;border-radius:999px;border:1px dashed var(--border-strong);background:#fff;font-size:12px;font-weight:600;color:var(--brand);padding:0 10px}
.rolerow{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;padding:16px 0;border-top:1px solid var(--border);align-items:start}
.rolerow:first-child{border-top:0;padding-top:0}
.menu{position:absolute;z-index:20;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(5,13,24,.12);padding:6px;min-width:220px}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;font-size:13px}
.menu button:hover{background:var(--bg-subtle)}
.menu small{display:block;color:var(--muted);font-size:12px}

/* summary list */
.sum{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:center;padding:14px 24px;border-top:1px solid var(--border)}
.sum .k{color:var(--muted);font-size:13px}
.sum .v{font-size:13px;font-weight:500}

/* list table */
.thead,.trow{display:grid;grid-template-columns:2.2fr 1.3fr .8fr 2fr 1.2fr 24px;gap:12px;align-items:center;padding:0 24px}
.thead{height:36px;border-top:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.trow{height:58px;border-top:1px solid var(--border);cursor:pointer}
.trow:hover{background:var(--bg-subtle)}
.lrow{display:grid;grid-template-columns:2.6fr 1.4fr 1.6fr 24px;gap:12px;align-items:center;padding:0 24px;height:58px;border-top:1px solid var(--border);cursor:pointer}
.lrow:hover{background:var(--bg-subtle)}
.lrow.hl{background:#f3f6fa}
.idn{display:flex;align-items:center;gap:12px}
.idn b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.idn span{font-size:12px;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:8px 2px 10px;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--strong);font-weight:500;border-color:var(--brand)}
.tab .n{font-size:11px;background:var(--neu-bg);border-radius:6px;padding:0 6px}

/* banners */
.banner{display:flex;gap:14px;align-items:center;background:var(--ok-banner);border-radius:10px;padding:16px 20px}
.banner .c{width:28px;height:28px;border-radius:999px;background:#fff;display:grid;place-items:center;color:var(--pos)}
.banner .c svg{width:16px;height:16px}
.banner b{display:block;font-weight:600}
.banner span{font-size:13px;color:var(--muted)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,13,24,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(460px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 48px rgba(5,13,24,.2);overflow:hidden}
.modal .mh{padding:22px 24px 14px}
.modal .mh h3{margin:0 0 4px;font-size:20px;font-weight:600}
.modal .mh p{margin:0;font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:136px 1fr;padding:11px 24px;border-top:1px solid var(--border);font-size:13px}
.mrow .k{color:var(--muted)}
.mrow .v{font-weight:500}
.msign{display:flex;gap:12px;align-items:center;background:var(--bg-subtle);border-top:1px solid var(--border);padding:16px 24px}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--border)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(1turn)}}

/* request progress */
.rp{display:flex;align-items:center;gap:14px;padding:18px 24px}
.rp .s{display:flex;gap:10px;align-items:center}
.rp .s b{display:block;font-weight:500;font-size:14px;line-height:1.25}
.rp .s span{font-size:12px;color:var(--muted)}
.ring{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;background:#fff}
.ring.done{background:var(--brand);border-color:var(--brand)}
.ring.done img{width:13px}
.ring.cur{border:2px solid var(--brand)}
.ring.cur::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:20px 16px;border-left:1px solid var(--border)}
.stats>div:first-child{border-left:0}
.stats .big{font-size:28px;font-weight:500;margin:6px 0 10px}

/* notifications */
.notif{position:fixed;top:56px;right:24px;width:360px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px rgba(5,13,24,.16);z-index:40;overflow:hidden}
.notif h4{margin:0;padding:16px 20px;font-size:16px;font-weight:600}
.nitem{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:flex-start}
.nitem:hover{background:var(--bg-subtle)}
.nitem.unread{background:#f3f6fa}
.nitem b{display:block;font-weight:500;font-size:13px}
.nitem span{font-size:12px;color:var(--muted)}
.nitem time{margin-left:auto;font-size:12px;color:var(--muted)}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brand-strong);color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(5,13,24,.25)}

/* prototype-only control */
.proto{position:fixed;right:16px;bottom:16px;z-index:45;background:#fff;border:1px dashed var(--brand);border-radius:12px;padding:10px 12px;font-size:12px;display:flex;gap:8px;align-items:center;box-shadow:0 6px 18px rgba(5,13,24,.1)}
.proto b{color:var(--brand)}

@media (max-width:900px){
  .side{display:none}
  .body{padding:0 8px 8px}
  main{padding:20px 16px 48px}
  .steps{overflow-x:auto}
  .step .meta{display:none}
  .grid2,.typecards,.cols,.rolerow{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr auto}
  .sum .k{grid-column:1/-1}
  .who{display:none}
  .thead{display:none}
  .trow,.lrow{grid-template-columns:1fr auto}
  .trow>:nth-child(n+3):not(:last-child),.lrow>:nth-child(3){display:none}
  .stats{grid-template-columns:1fr}
  .stats>div{border-left:0;border-top:1px solid var(--border)}
  .notif{right:8px;left:8px;width:auto}
}
</style>
</head>
<body>
<header class="top">
  <div class="brand"><img src="assets/logo.png" alt="">Universal Mint</div>
  <button class="bell" data-act="bell" aria-label="Notifications"><i data-lucide="bell" style="width:18px;height:18px;color:#5a6472"></i><img class="dot" id="unread" src="assets/unread.svg" alt="" hidden></button>
  <div class="vdiv"></div>
  <div class="acct"><div class="avatar">JU</div><div class="who"><b>Juya Kim</b><span>juya.k@bharvest.io</span></div><img src="assets/chevron-down.svg" width="14" alt=""></div>
</header>
<div class="body"><div class="panel">
  <aside class="side">
    <nav>
      <button class="nav" data-go="home"><img src="assets/nav-home.svg" alt="">Home</button>
      <button class="nav" data-soon><img src="assets/nav-inbox.svg" alt="">My tasks<span class="count">5</span></button>
      <button class="nav" data-soon><img src="assets/nav-inbox.svg" alt="">Requests</button>
      <button class="nav" data-soon><img src="assets/nav-proposals.svg" alt="">Proposals</button>
      <button class="nav" data-go="tokens"><img src="assets/nav-tokens.svg" alt="">Tokens</button>
      <button class="nav" data-soon><img src="assets/nav-disclosures.svg" alt="">Disclosures</button>
    </nav>
    <div class="org">
      <div class="glabel">Organization</div>
      <button class="nav" data-soon><img src="assets/nav-members.svg" alt="">Members</button>
      <button class="nav" data-soon><img src="assets/nav-rules.svg" alt="">Approval rules</button>
      <button class="nav" data-soon><img src="assets/nav-custodians.svg" alt="">Custodians</button>
      <button class="nav" data-soon><img src="assets/nav-credentials.svg" alt="">Credentials</button>
      <button class="nav" data-soon><img src="assets/nav-audit.svg" alt="">Audit log</button>
      <button class="nav" data-soon><img src="assets/nav-profile.svg" alt="">Profile &amp; wallets</button>
    </div>
    <div class="switch"><div class="mono"><img src="assets/org.svg" width="16" alt=""></div><div class="grow"><b>Ault Global Commodities</b><span>Issuer</span></div><img src="assets/chevron-down.svg" width="14" alt=""></div>
  </aside>
  <main id="app"></main>
</div></div>
<div id="layer"></div>
<div class="proto" id="proto" hidden></div>

<script>
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const today = new Date();
const fmt = d => d.toLocaleDateString('en-US', {month:'short', day:'numeric'});
const kb = n => n > 1e6 ? (n/1048576).toFixed(1)+' MB' : Math.max(1, Math.round(n/1024))+' KB';

const MEMBERS = [
  {id:'gov', name:'Governance', meta:'2 of 4', sub:'Approval group'},
  {id:'juya', name:'Juya Kim', sub:'Member'},
  {id:'joe', name:'Joe Miller', sub:'Member'},
  {id:'jason', name:'Jason Lee', sub:'Member'},
  {id:'david', name:'David Park', sub:'Member'},
  {id:'colossus', name:'Colossus', sub:'Another organization'},
];
const ROLES = [
  ['am','Account manager',false,'Confirms redemption amounts, delivery details, and fees with the investor.'],
  ['mint','Mint approver',true,'Approves minting for issuance requests.'],

    custNames()[0]?.replace(/^The /,'') || '', `${d.size} ${sym()} steps`, `${rolePeople().length} role${rolePeople().length>1?'s':''}`, '' ][i];

function steps(cur){
  let h = '<div class="card"><div class="steps">';

    const done = i < cur, on = i===cur;
    if (i) h += `<div class="conn ${i<=cur?'on':''}"></div>`;

      <span class="dotn">${done?'<img src="assets/check.svg" alt="">':i+1}</span>
      <span><span class="nm">${n}</span>${done?`<span class="meta" style="display:block">${esc(stepMeta(i))}</span>`:''}</span></button>`;
  });

}

/* ---------- modal + notifications ---------- */
function modalHTML(){
  if (S.modal==='submit') return `<div class="scrim" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt">
    <div class="mh"><h3 id="mt">Submit ${esc(S.d.name)} for review?</h3><p>The platform checks your settings and documents before the token can take requests.</p></div>

    <div class="mfoot"><button class="btn" data-act="closemodal" ${S.signing?'disabled':''}>Cancel</button><button class="btn primary" data-act="sign" ${S.signing?'disabled':''}>${S.signing?'<span class="spin"></span>Signing':'Sign and submit'}</button></div>
  </div></div>`;
  if (S.modal==='discard') return `<div class="scrim" data-act="closemodal"><div class="modal" role="dialog" aria-modal="true">
    <div class="mh"><h3>Discard this draft?</h3><p>Everything you entered for ${esc(S.d.name||'this token')} is removed from this browser.</p></div>
    <div class="mfoot"><button class="btn" data-act="closemodal">Keep editing</button><button class="btn primary" style="background:var(--danger);border-color:var(--danger)" data-act="discardok">Discard draft</button></div></div></div>`;
  return '';
}
function notifHTML(){
  if (!S.notifOpen) return '';
  const items = [
    ...(S.listing==='live'?[['check',`${S.d.name} is listed`,'Approved by the platform. Issue your first tokens.','now','ad8',true]]:[]),
    ...(S.listing==='review'?[['file-text',`${S.d.name} submitted`,'In platform review','now','ad7']]:[]),
    ['users-round','Joe Miller approved ISS-0011','ISS-0011, 1 of 2 approved','40m'],
    ['coins','800 BMAX minted','ISS-0010 for Juno Partners','2h'],
    ['check','Proposal passed','PRP-0004, member role change','1d'],
    ['truck','Redemption delivered','RED-0002, 150 ASLV to Minji Park','2d'],
  ];
  return `<div class="notif" role="dialog" aria-label="Notifications"><h4>Notifications</h4>${items.map(([ic,t,s,tm,go,un])=>`<button class="nitem ${un?'unread':''}" ${go?`data-go="${go}"`:'data-soon'}><span class="ico"><i data-lucide="${ic}"></i></span><span class="grow"><b>${esc(t)}</b><span>${esc(s)}</span></span><time>${tm}</time></button>`).join('')}</div>`;
}

/* ---------- render ---------- */
function render(){
  $('#app').innerHTML = V[S.screen]();
  $('#layer').innerHTML = modalHTML() + notifHTML();
  $('#unread').hidden = !S.unread;
  document.querySelectorAll('.side .nav').forEach(b=>b.classList.toggle('on', b.dataset.go===(S.screen==='home'?'home':'tokens') && !b.hasAttribute('data-soon')));
  const p = $('#proto');
  p.hidden = !(S.listing==='review' && ['ad7','tokens'].includes(S.screen));
  p.innerHTML = '<b>Prototype</b><span class="muted">Platform review is outside the portal.</span><button class="btn primary" data-act="approve">Approve listing</button>';
  if (window.lucide) lucide.createIcons();
}

/* ---------- events ---------- */
function next(to){
  if (to==='submit'){ S.modal='submit'; render(); return; }
  go(to);
}
const PREV = {ad2:'ad1', ad3:'ad2', ad4:'ad3', ad5:'ad4', ad5b:'ad5', ad6:'ad5b'};
const STEP_SCREEN = ['ad1','ad2','ad3','ad4','ad5','ad6'];

document.addEventListener('click', e => {
  const t = e.target.closest('[data-go],[data-next],[data-act],[data-step],[data-kind],[data-src],[data-token],[data-cust],[data-who],[data-size],[data-addrole],[data-rmrole],[data-pick],[data-rmdoc],[data-toggle],[data-soon]');
  if (!t) { if (S.menu){S.menu=null;render();} if (S.notifOpen && !e.target.closest('.notif')){S.notifOpen=false;render();} return; }
  const ds = t.dataset, d = S.d;
  if (t.tagName==='LABEL' || t.closest('label')) { /* file pickers handle themselves */ if (!ds.act) return; }
  if (ds.go){ e.stopPropagation(); S.notifOpen=false; if (ds.go==='ad8' || ds.go==='ad7') S.justSubmitted = S.justSubmitted && ds.go==='ad7'; go(ds.go); return; }
  if (ds.next){ next(ds.next); return; }
  if (ds.step){ go(STEP_SCREEN[+ds.step]); return; }
  if (ds.kind){ d.kind=ds.kind; render(); return; }
  if (ds.src){ d.tokenSrc=ds.src; render(); return; }
  if (ds.token){ d.token=ds.token; d.name = ds.token==='apd'?'Ault Palladium':'Ault Platinum'; render(); return; }
  if (ds.cust){ d.custodians[ds.cust]=!d.custodians[ds.cust]; render(); return; }
  if (ds.who){ d.who=ds.who; render(); return; }
  if (ds.size){ d.size=+ds.size; render(); return; }
  if (ds.addrole){ e.stopPropagation(); S.menu = S.menu===ds.addrole?null:ds.addrole; render(); return; }
  if (ds.pick){ const [k,id]=ds.pick.split(':'); d.roles[k].push(id); S.menu=null; render(); return; }
  if (ds.rmrole){ const [k,id]=ds.rmrole.split(':'); d.roles[k]=d.roles[k].filter(x=>x!==id); render(); return; }
  if (ds.rmdoc){ d.docs.splice(+ds.rmdoc,1); render(); return; }
  if (ds.toggle){ S[ds.toggle]=!S[ds.toggle]; render(); return; }
  if (ds.soon!==undefined && !ds.act){ toast('Not part of this prototype'); return; }
  switch (ds.act){
    case 'start': S.d=fresh(); S.draftSaved=false; go('ad1'); break;
    case 'back': go(PREV[S.screen]||'tokens'); break;
    case 'save': S.draftSaved=true; go('tokens'); toast('Draft saved in this browser'); break;
    case 'discard': S.modal='discard'; render(); break;
    case 'discardok': S.modal=null; S.draftSaved=false; S.d=fresh(); go('tokens'); toast('Draft discarded'); break;
    case 'closemodal': if (t.classList.contains('scrim') && e.target!==t) break; if (!S.signing){ S.modal=null; render(); } break;
    case 'combo': d.showCombo=!d.showCombo; render(); break;
    case 'rmpor': d.por=null; render(); break;
    case 'clearimg': d.img=''; d.imgUrl=''; render(); break;
    case 'burnother': d.burnOther=!d.burnOther; render(); break;
    case 'bell': e.stopPropagation(); S.notifOpen=!S.notifOpen; if (S.notifOpen) S.unread=false; render(); break;
    case 'sign':
      S.signing=true; render();
      setTimeout(()=>{ S.signing=false; S.modal=null; S.listing='review'; S.draftSaved=false; S.submittedAt=new Date(); S.justSubmitted=true; go('ad7'); }, 1600);
      break;
    case 'approve':
      S.listing='live'; S.liveAt=new Date(); S.unread=true; S.justSubmitted=false;
      go('home'); toast(`${d.name} was approved. Check notifications.`); break;
  }
});

document.addEventListener('input', e => {
  const b = e.target.dataset.bind; if (!b) return;
  const d = S.d;
  d[b] = e.target.type==='number' ? e.target.value : e.target.value;
  if (b==='imgUrl'){ d.img = /^https?:\/\/\S+$/.test(d.imgUrl) ? d.imgUrl : (d.img.startsWith('blob:')?d.img:''); }
  // live updates without full re-render (keeps focus)
  if (b==='name'){ const pv=$('#pv-name'); if (pv) pv.textContent = d.name || 'Token name'; const h=$('.rhead h1'); if(h) h.textContent = d.name || 'New token'; document.querySelector('[data-next]').disabled = !d.name.trim(); }
  if (b==='desc'){ const pv=$('#pv-desc'); if (pv) pv.textContent = d.desc; }
  if (b==='size'){ const n=Number(d.size)||0; $('#size-hint').innerHTML = n>0?`Investors request ${n}, ${n*2}, ${n*3} ${sym()}…`:'<span class="req">Enter a size above 0.</span>'; document.querySelector('[data-next]').disabled = !(n>0); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.bind && el.tagName==='SELECT'){ S.d[el.dataset.bind]=el.value; render(); return; }
  if (el.dataset.bind==='size' || el.dataset.bind==='imgUrl'){ render(); return; }
  const f = el.dataset.file; if (!f || !el.files.length) return;
  const files = [...el.files];
  takeFiles(f, files);
});
function takeFiles(kind, files){
  const d = S.d, MAX = 20*1048576;
  const ok = files.filter(x => x.size <= MAX);
  if (ok.length < files.length) toast('Files must be 20 MB or smaller');
  if (!ok.length) return;
  if (kind==='img'){ if (!/^image\//.test(ok[0].type)) return toast('Use a PNG or JPG image'); d.img = URL.createObjectURL(ok[0]); d.imgUrl=''; }
  if (kind==='docs') d.docs.push(...ok.map(x=>({name:x.name,size:x.size})));
  if (kind==='por') d.por = {name:ok[0].name, size:ok[0].size};
  if (kind==='reviewFiles') d.reviewFiles = [...(d.reviewFiles||[]), ...ok.map(x=>({name:x.name,size:x.size}))];
  render();
}
// drag and drop on the document dropzone
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault();
  z.classList.toggle('over', ev==='dragover');
  if (ev==='drop') takeFiles(z.dataset.drop, [...e.dataTransfer.files]);
}));
document.addEventListener('keydown', e => { if (e.key==='Escape'){ if (S.modal && !S.signing){S.modal=null;render();} else if (S.notifOpen||S.menu){S.notifOpen=false;S.menu=null;render();} } });

render();
</script>
