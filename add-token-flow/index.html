<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Token</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&family=IBM+Plex+Sans+KR:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/lucide@0.460.0/dist/umd/lucide.min.js"></script>
<style>
:root{
  --bg-muted:#ebedf0; --bg-subtle:#f7f8fa; --surface:#fff;
  --border:#e6e8eb; --border-strong:#d9d9d9;
  --brand:#004285; --brand-strong:#091d38; --brand-tint:#eef3fa;
  --strong:#050d18; --muted:#5a6472; --faint:#b9bec4;
  --danger:#b31942; --discard:#b3123a;
  --pos-bg:#e3f4ea; --pos:#1d7a48; --prog-bg:#e6effb; --prog:#2a5db0;
  --neu-bg:#eef0f2; --crit-bg:#fbe8ec; --att-bg:#fdf1dc; --att:#9a5b00;
  --ok-banner:#e6f4ec; --crit-banner:#fdf0f2; --att-banner:#fdf6e7; --prog-banner:#eef3fa;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg-muted);font-family:"DM Sans",system-ui,sans-serif;color:var(--strong);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:inherit}
[hidden]{display:none!important}

/* shell */
.top{height:62px;display:flex;align-items:center;gap:16px;padding:12px 20px}
.brand{flex:1;display:flex;align-items:center;gap:8px;font-weight:700;font-size:16px;color:var(--brand-strong)}
.brand img{width:22px;height:22px}
.bell{position:relative;width:36px;height:36px;border:0;background:none;border-radius:10px;display:grid;place-items:center}
.bell:hover{background:var(--bg-subtle)}
.bell .dot{position:absolute;left:24px;top:6px;width:7px;height:7px}
.vdiv{width:1px;height:24px;background:var(--border-strong)}
.acct{display:flex;align-items:center;gap:12px}
.avatar{width:32px;height:32px;border-radius:999px;background:var(--bg-subtle);display:grid;place-items:center;font-size:12px;font-weight:500;color:var(--muted)}
.who b{display:block;font-weight:600;font-size:14px;line-height:1.5}
.who span{display:block;font-size:12px;color:var(--muted);line-height:1.45}
.body{padding:0 20px 20px}
.panel{display:flex;background:var(--bg-subtle);border:1px solid var(--border);border-radius:20px;overflow:hidden;min-height:calc(100vh - 82px)}
.side{width:248px;flex:none;border-right:1px solid var(--border);display:flex;flex-direction:column}
.side nav{flex:1;padding:12px 0;display:flex;flex-direction:column;gap:4px}
.nav{margin:0 12px;height:37px;display:flex;align-items:center;gap:12px;padding:8px 16px;border-radius:10px;color:var(--muted);position:relative;border:0;background:none;text-align:left;width:calc(100% - 24px)}
.nav:hover{background:var(--bg-muted)}
.nav img{width:16px;height:16px}
.nav.on{background:var(--bg-muted);color:var(--strong);font-weight:600}
.nav.on::before{content:"";position:absolute;left:0;top:8px;width:3px;height:21px;border-radius:6px;background:var(--brand)}
.nav .count{margin-left:auto;min-width:20px;height:20px;border-radius:999px;background:var(--danger);color:#fff;font-size:12px;font-weight:500;display:grid;place-items:center;padding:0 4px}
.side .org{border-top:1px solid var(--border);padding:12px 0;display:flex;flex-direction:column;gap:4px}
.glabel{padding:6px 28px 8px;font-size:11px;font-weight:700;letter-spacing:.55px;text-transform:uppercase;color:var(--faint)}
.switch{margin:8px 12px 12px;border:1px solid var(--border);border-radius:8px;padding:12px;display:flex;gap:8px;align-items:center;font-size:12px;line-height:1.45}
.mono{width:28px;height:28px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.switch b{display:block;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:150px}
.switch span{color:var(--muted)}
main{flex:1;min-width:0;padding:32px 32px 120px;display:flex;flex-direction:column;gap:24px}

/* type + bits */
.back{height:32px;display:inline-flex;align-items:center;font-size:13px;font-weight:500;color:var(--brand);border:0;background:none;padding:0;align-self:flex-start}
h1{margin:0;font-size:32px;font-weight:700;line-height:1.2}
.sub{color:var(--muted);font-size:14px}
.muted{color:var(--muted)}
.small{font-size:12px}
.req{color:var(--danger)}
.opt{color:var(--muted);font-weight:500}
.err{font-size:12px;color:var(--danger)}
.eyebrow{font-size:11px;font-weight:600;text-transform:uppercase;color:var(--muted);letter-spacing:.2px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;overflow:hidden}
.card-h{padding:20px 24px 16px}
.card-h h2{margin:0;font-size:20px;font-weight:600;line-height:1.3}
.card-b{padding:0 24px 24px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px;padding:12px 24px;border-top:1px solid var(--border)}
.grow{flex:1;min-width:0}
.row .t{font-weight:500}
.row .d{font-size:12px;color:var(--muted)}
.ico{width:28px;height:28px;border-radius:8px;background:var(--bg-subtle);display:grid;place-items:center;flex:none;color:var(--muted)}
.ico svg{width:16px;height:16px}
.ico.ok{background:var(--pos-bg);color:var(--pos);border-radius:999px}

.btn{height:36px;padding:0 16px;border-radius:10px;font-size:12px;font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--border-strong);background:var(--surface);color:var(--strong);white-space:nowrap}
.btn:hover{background:var(--bg-subtle)}
.btn.primary{background:var(--brand);border-color:var(--brand);color:#fff}
.btn.primary:hover{background:#00356b}
.btn.danger{background:var(--danger);border-color:var(--danger);color:#fff}
.btn.danger:hover{background:#951437}
.btn:disabled,.btn[aria-disabled=true]{opacity:.45;cursor:not-allowed}
.btn svg{width:16px;height:16px}
.btn.wide{width:100%}
.link{border:0;background:none;padding:0;font-size:13px;font-weight:500;color:var(--brand);text-align:left}
.link.danger{color:var(--discard);font-weight:600}
.link:hover{text-decoration:underline}

.badge{display:inline-flex;align-items:center;height:22px;padding:0 8px;border-radius:999px;font-size:12px;font-weight:500;white-space:nowrap}
.b-pos{background:var(--pos-bg);color:var(--pos)}
.b-prog{background:var(--prog-bg);color:var(--prog)}
.b-neu{background:var(--neu-bg);color:var(--muted)}
.b-crit{background:var(--crit-bg);color:var(--danger)}
.b-att{background:var(--att-bg);color:var(--att)}

.field{display:flex;flex-direction:column;gap:8px}
.label{font-size:13px;font-weight:500}
.input{height:44px;width:100%;border:1px solid var(--border);border-radius:10px;padding:0 14px;background:var(--surface);font-size:14px}
textarea.input{height:auto;min-height:72px;padding:10px 14px;resize:vertical}
.input::placeholder{color:var(--muted)}
.input:focus,.select:focus{outline:2px solid #9bb7d6;outline-offset:0;border-color:var(--brand)}
.input.bad,.select.bad{border-color:var(--danger)}
.input.ro{display:flex;align-items:center;background:var(--bg-subtle);color:var(--muted)}
.select{appearance:none;height:44px;width:100%;border:1px solid var(--border);border-radius:10px;padding:0 40px 0 14px;background:var(--surface) url(assets/chevron-down.svg) no-repeat right 14px center/16px;font-size:14px}
.select:disabled{background-color:var(--bg-subtle);color:var(--muted)}
.hint{font-size:12px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.suffix{position:relative}
.suffix .input{padding-right:150px}
.suffix span{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-size:12px;color:var(--muted);pointer-events:none}

/* steps */
.steps{display:flex;align-items:center;gap:12px;padding:20px 24px}
.step{display:flex;align-items:center;gap:10px;border:0;background:none;padding:0;text-align:left;flex:none}
.step[disabled]{cursor:default}
.dotn{width:24px;height:24px;border-radius:12px;display:grid;place-items:center;font-size:12px;font-weight:600;background:#fff;border:1.5px solid var(--faint);color:var(--muted);flex:none}
.dotn img{width:14px;height:14px}
.step.done .dotn,.step.cur .dotn{background:var(--brand);border-color:var(--brand);color:#fff}
.step .nm{font-size:14px;font-weight:500;color:var(--muted);line-height:1.25}
.step.done .nm{color:var(--strong)}
.step.cur .nm{color:var(--strong);font-weight:600}
.step .meta{font-size:13px;color:var(--muted);line-height:1.25}
.step.flag .meta{color:var(--danger)}
.conn{flex:1;height:2px;background:var(--border);min-width:12px}
.conn.on{background:var(--brand)}
.step.done:hover .nm{text-decoration:underline}

.rhead{display:flex;align-items:center;gap:16px}
.footer{display:flex;align-items:center;gap:12px;padding-top:8px}

/* segmented */
.seg{display:flex;background:var(--bg-subtle);border:1px solid var(--border);border-radius:10px;padding:3px}
.seg button{flex:1;height:34px;border:0;border-radius:8px;background:none;font-size:12px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--strong);font-weight:500;box-shadow:0 1px 2px rgba(5,13,24,.08)}

/* options list */
.opt-row{display:flex;align-items:center;gap:12px;padding:14px 24px;border-top:1px solid var(--border);cursor:pointer;width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left}
.opt-row:hover{background:var(--bg-subtle)}
.opt-row.sel{background:#f3f6fa}
.opt-row.dis{cursor:default;color:var(--faint)}
.opt-row.dis:hover{background:none}
.radio{width:14px;height:14px;border-radius:50%;border:1.5px solid var(--faint);flex:none;background:#fff}
.sel .radio{border:4px solid var(--brand)}
.chk{width:16px;height:16px;border-radius:4px;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;background:#fff}
.chk.on{background:var(--brand);border-color:var(--brand)}
.chk.on::after{content:"";width:8px;height:4px;border:2px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.tile{width:32px;height:32px;border-radius:8px;background:var(--bg-subtle);display:grid;place-items:center;font-size:11px;font-weight:600;color:var(--strong);flex:none}
.coin{width:14px;height:14px;border-radius:50%}

.typecards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.typecard{border:1px solid var(--border);border-radius:10px;padding:16px;background:#fff;text-align:left;display:flex;gap:12px}
.typecard.sel{border-color:var(--brand);background:#f3f6fa;box-shadow:inset 0 0 0 1px var(--brand)}
.typecard.sel .radio{border:4px solid var(--brand)}
.typecard b{display:block;font-weight:600}

.thumb{width:64px;height:64px;border-radius:12px;border:1px dashed var(--border-strong);background:var(--bg-subtle) center/cover no-repeat;flex:none}
.thumb.has{border-style:solid;border-color:var(--border)}
.drop{border:1px dashed var(--border-strong);border-radius:10px;padding:14px;display:flex;justify-content:center;gap:6px;font-size:13px;background:#fff;cursor:pointer;width:100%}
.drop.over{border-color:var(--brand);background:var(--brand-tint)}
.file{display:flex;align-items:center;gap:12px;border:1px solid var(--border);border-radius:10px;padding:10px 14px}
.empty{padding:28px 24px;border-top:1px solid var(--border);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px}
.empty b{font-weight:600}
.empty p{margin:0 0 6px;font-size:13px;color:var(--muted);max-width:460px}

.chips{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.chip{height:26px;border-radius:999px;background:var(--neu-bg);display:inline-flex;align-items:center;gap:6px;padding:0 6px 0 10px;font-size:12px;font-weight:500}
.chip small{color:var(--muted);font-weight:400}
.chip button{border:0;background:none;color:var(--muted);padding:0 2px;font-size:13px;line-height:1}
.addchip{height:26px;border-radius:999px;border:1px dashed var(--border-strong);background:#fff;font-size:12px;font-weight:600;color:var(--brand);padding:0 10px}
.rolerow{display:grid;grid-template-columns:1fr 1.15fr;gap:16px;padding:16px 0;border-top:1px solid var(--border);align-items:start}
.rolerow:first-child{border-top:0;padding-top:0}
.menu{position:absolute;z-index:20;background:#fff;border:1px solid var(--border);border-radius:10px;box-shadow:0 8px 24px rgba(5,13,24,.12);padding:6px;min-width:220px}
.menu button{display:flex;width:100%;gap:8px;align-items:center;border:0;background:none;border-radius:8px;padding:8px 10px;text-align:left;font-size:13px}
.menu button:hover{background:var(--bg-subtle)}
.menu small{display:block;color:var(--muted);font-size:12px}

.sum{display:grid;grid-template-columns:160px 1fr auto;gap:12px;align-items:center;padding:14px 24px;border-top:1px solid var(--border)}
.sum .k{color:var(--muted);font-size:13px}
.sum .v{font-size:13px;font-weight:500}
.sum .v.flag{color:var(--danger)}

.thead,.trow{display:grid;grid-template-columns:2.2fr 1.3fr .8fr 2fr 1.2fr 24px;gap:12px;align-items:center;padding:0 24px}
.thead{height:36px;border-top:1px solid var(--border);font-size:11px;font-weight:600;color:var(--muted);text-transform:uppercase}
.trow{height:58px;border-top:1px solid var(--border);cursor:pointer}
.trow:hover{background:var(--bg-subtle)}
.lrow{display:grid;grid-template-columns:2.6fr 1.4fr 1.6fr 24px;gap:12px;align-items:center;padding:0 24px;height:58px;border-top:1px solid var(--border);cursor:pointer}
.lrow:hover{background:var(--bg-subtle)}
.lrow.hl{background:#f3f6fa}
.idn{display:flex;align-items:center;gap:12px}
.idn b{display:block;font-weight:500;font-size:14px;line-height:1.3}
.idn span{font-size:12px;color:var(--muted)}
.bar{flex:1;height:4px;border-radius:2px;background:var(--border);overflow:hidden}
.bar i{display:block;height:100%;background:var(--brand)}
.tabs{display:flex;gap:20px;border-bottom:1px solid var(--border)}
.tab{border:0;background:none;padding:8px 2px 10px;font-size:14px;color:var(--muted);display:flex;gap:6px;align-items:center;border-bottom:2px solid transparent;margin-bottom:-1px}
.tab.on{color:var(--strong);font-weight:500;border-color:var(--brand)}
.tab .n{font-size:11px;background:var(--neu-bg);border-radius:6px;padding:0 6px}

/* banners */
.banner{display:flex;gap:14px;align-items:center;background:var(--ok-banner);border-radius:10px;padding:16px 20px}
.banner .c{width:28px;height:28px;border-radius:999px;background:#fff;display:grid;place-items:center;color:var(--pos);flex:none}
.banner .c svg{width:16px;height:16px}
.banner b{display:block;font-weight:600}
.banner span{font-size:13px;color:var(--muted)}
.banner.crit{background:var(--crit-banner)} .banner.crit .c{color:var(--danger)}
.banner.att{background:var(--att-banner)} .banner.att .c{color:var(--att)}
.banner.prog{background:var(--prog-banner)} .banner.prog .c{color:var(--prog)}
.banner.neu{background:#eef0f2} .banner.neu .c{color:var(--muted)}

/* tooltip */
.tipwrap{position:relative}
.tip{position:absolute;right:0;top:calc(100% + 8px);width:280px;background:var(--brand-strong);color:#fff;border-radius:10px;padding:12px 14px;font-size:12px;z-index:30;box-shadow:0 8px 24px rgba(5,13,24,.25)}
.tip b{display:block;font-size:13px;margin-bottom:2px}
.tip::before{content:"";position:absolute;right:28px;top:-5px;width:10px;height:10px;background:var(--brand-strong);transform:rotate(45deg)}

/* modal */
.scrim{position:fixed;inset:0;background:rgba(5,13,24,.35);display:grid;place-items:center;z-index:50;padding:16px}
.modal{width:min(480px,100%);background:#fff;border-radius:14px;box-shadow:0 20px 48px rgba(5,13,24,.2);overflow:hidden}
.modal .mh{padding:22px 24px 14px}
.modal .mh h3{margin:0 0 4px;font-size:20px;font-weight:600}
.modal .mh p{margin:0;font-size:13px;color:var(--muted)}
.mrow{display:grid;grid-template-columns:136px 1fr;padding:11px 24px;border-top:1px solid var(--border);font-size:13px}
.mrow .k{color:var(--muted)}
.mrow .v{font-weight:500}
.mbody{padding:4px 24px 16px;display:flex;flex-direction:column;gap:8px}
.msign{display:flex;gap:12px;align-items:center;background:var(--bg-subtle);border-top:1px solid var(--border);padding:16px 24px}
.msign.bad{background:var(--crit-banner)}
.msign.bad .ico{color:var(--danger)}
.mfoot{display:flex;justify-content:flex-end;gap:8px;padding:14px 24px;border-top:1px solid var(--border)}
.spin{width:14px;height:14px;border-radius:50%;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;animation:sp .8s linear infinite;display:inline-block}
.spin.dark{border-color:rgba(0,66,133,.2);border-top-color:var(--brand)}
@keyframes sp{to{transform:rotate(1turn)}}

/* request progress */
.rp{display:flex;align-items:center;gap:14px;padding:18px 24px}
.rp .s{display:flex;gap:10px;align-items:center;flex:none}
.rp .s b{display:block;font-weight:500;font-size:14px;line-height:1.25}
.rp .s span{font-size:12px;color:var(--muted)}
.ring{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--faint);flex:none;display:grid;place-items:center;background:#fff;font-size:13px;font-weight:700;line-height:1}
.ring.done{background:var(--brand);border-color:var(--brand)}
.ring.done img{width:13px}
.ring.cur{border:2px solid var(--brand)}
.ring.cur::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--brand)}
.ring.stop{border-color:var(--danger);color:var(--danger)}
.ring.stopn{border-color:var(--muted);color:var(--muted)}
.cols{display:grid;grid-template-columns:1fr 300px;gap:16px;align-items:start}

.stats{display:grid;grid-template-columns:repeat(3,1fr)}
.stats>div{padding:20px 16px;border-left:1px solid var(--border)}
.stats>div:first-child{border-left:0}
.stats .big{font-size:28px;font-weight:500;margin:6px 0 10px}

/* tasks */
.tasks{display:grid;grid-template-columns:340px minmax(0,1fr);gap:16px;align-items:start}
.tasks>*,.cols>*{min-width:0}
.rp{overflow-x:auto}
.titem{display:flex;gap:10px;width:100%;text-align:left;border:0;border-top:1px solid var(--border);background:none;padding:12px 16px;align-items:flex-start}
.titem:first-child{border-top:0}
.titem:hover{background:var(--bg-subtle)}
.titem.on{background:#f3f6fa;box-shadow:inset 3px 0 0 var(--brand)}
.titem b{display:block;font-weight:500;font-size:13px}
.titem span{font-size:12px;color:var(--muted)}
.titem time{margin-left:auto;font-size:12px;color:var(--muted);flex:none}

/* notifications */
.notif{position:fixed;top:56px;right:24px;width:360px;background:#fff;border:1px solid var(--border);border-radius:14px;box-shadow:0 16px 40px rgba(5,13,24,.16);z-index:40;overflow:hidden}
.notif h4{margin:0;padding:16px 20px;font-size:16px;font-weight:600}
.nitem{display:flex;gap:12px;padding:12px 20px;border-top:1px solid var(--border);width:100%;background:none;border-left:0;border-right:0;border-bottom:0;text-align:left;align-items:flex-start}
.nitem:hover{background:var(--bg-subtle)}
.nitem.unread{background:#f3f6fa}
.nitem b{display:block;font-weight:500;font-size:13px}
.nitem span{font-size:12px;color:var(--muted)}
.nitem time{margin-left:auto;font-size:12px;color:var(--muted);flex:none}

.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--brand-strong);color:#fff;border-radius:10px;padding:12px 18px;font-size:13px;z-index:60;box-shadow:0 8px 24px rgba(5,13,24,.25)}

/* prototype-only control panel (not product UI) */
.proto{position:fixed;right:16px;bottom:16px;z-index:45;width:300px;background:#fff;border:1.5px dashed var(--brand);border-radius:12px;box-shadow:0 6px 18px rgba(5,13,24,.12);font-family:"IBM Plex Sans KR","DM Sans",sans-serif;font-size:12px}
.proto .ph{display:flex;align-items:center;gap:8px;padding:10px 12px;border:0;background:none;width:100%;text-align:left}
.proto .ph b{color:var(--brand);font-size:12px}
.proto .pb{padding:0 12px 12px;display:flex;flex-direction:column;gap:10px}
.proto .pl{font-size:11px;color:var(--muted);margin-bottom:4px}
.proto .seg button{font-size:11px;height:28px}
.proto .select{height:34px;font-size:12px;font-family:inherit}
.proto .btn{height:30px;font-size:11px;padding:0 10px;font-family:inherit}
.proto .pnote{font-size:11px;color:var(--muted);line-height:1.45}
.proto.min .pb{display:none}

@media (max-width:900px){
  .side{display:none}
  .body{padding:0 8px 8px}
  main{padding:20px 16px 140px}
  .steps,.rp{overflow-x:auto}
  .step .meta{display:none}
  .grid2,.typecards,.cols,.rolerow,.tasks{grid-template-columns:1fr}
  .sum{grid-template-columns:1fr auto}
  .sum .k{grid-column:1/-1}
  .who{display:none}
  .thead{display:none}
  .trow,.lrow{grid-template-columns:1fr auto}
  .trow>:nth-child(n+3):not(:last-child),.lrow>:nth-child(3){display:none}
  .stats{grid-template-columns:1fr}
  .stats>div{border-left:0;border-top:1px solid var(--border)}
  .notif{right:8px;left:8px;width:auto}
  .proto{left:8px;right:8px;width:auto}
}
</style>

<body>
<header class="top">
  <div class="brand"><img src="assets/logo.png" alt="">Universal Mint</div>
  <button class="bell" data-a="bell" aria-label="Notifications"><i data-lucide="bell" style="width:18px;height:18px;color:#5a6472"></i><img class="dot" id="unread" src="assets/unread.svg" alt="" hidden></button>
  <div class="vdiv"></div>
  <div class="acct"><div class="avatar" id="ini">JU</div><div class="who"><b id="pname">Juya Kim</b><span id="pmail">juya.k@bharvest.io</span></div><img src="assets/chevron-down.svg" width="14" alt=""></div>
</header>
<div class="body"><div class="panel">
  <aside class="side">
    <nav>
      <button class="nav" data-a="go" data-v="home" data-nav="home"><img src="assets/nav-home.svg" alt="">Home</button>
      <button class="nav" data-a="go" data-v="tasks" data-nav="tasks"><img src="assets/nav-inbox.svg" alt="">My tasks<span class="count" id="taskcount">4</span></button>
      <button class="nav" data-a="soon"><img src="assets/nav-inbox.svg" alt="">Requests</button>
      <button class="nav" data-a="soon"><img src="assets/nav-proposals.svg" alt="">Proposals</button>
      <button class="nav" data-a="go" data-v="tokens" data-nav="tokens"><img src="assets/nav-tokens.svg" alt="">Tokens</button>
      <button class="nav" data-a="soon"><img src="assets/nav-disclosures.svg" alt="">Disclosures</button>
    </nav>
    <div class="org">
      <div class="glabel">Organization</div>
      <button class="nav" data-a="soon"><img src="assets/nav-members.svg" alt="">Members</button>
      <button class="nav" data-a="soon"><img src="assets/nav-rules.svg" alt="">Approval rules</button>
      <button class="nav" data-a="soon"><img src="assets/nav-custodians.svg" alt="">Custodians</button>
      <button class="nav" data-a="soon"><img src="assets/nav-credentials.svg" alt="">Credentials</button>
      <button class="nav" data-a="soon"><img src="assets/nav-audit.svg" alt="">Audit log</button>
      <button class="nav" data-a="soon"><img src="assets/nav-profile.svg" alt="">Profile &amp; wallets</button>
    </div>
    <div class="switch"><div class="mono"><img src="assets/org.svg" width="16" alt=""></div><div class="grow"><b>Ault Global Commodities</b><span>Issuer</span></div><img src="assets/chevron-down.svg" width="14" alt=""></div>
  </aside>
  <main id="app"></main>
</div></div>
<div id="layer"></div>
<div class="proto" id="proto"></div>

<script>
/* ================= data ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt = d => d ? new Date(d).toLocaleDateString('en-US', {month:'short', day:'numeric'}) : '';
const fmtT = d => fmt(d) + ', ' + new Date(d).toLocaleTimeString('en-GB', {hour:'2-digit', minute:'2-digit'});
const mb = n => n >= 1048576 ? Math.round(n/1048576*10)/10 + ' MB' : Math.max(1, Math.round(n/1024)) + ' KB';
const clone = o => JSON.parse(JSON.stringify(o));

const PEOPLE = {
  juya: {name:'Juya Kim', ini:'JU', mail:'juya.k@bharvest.io'},
  joe:  {name:'Joe Miller', ini:'JM', mail:'joe.m@ault.com'},
};
const GOVERNANCE = ['Juya Kim','Joe Miller','Jason Lee','David Park']; // 2 of 4
const MEMBERS = [
  {id:'gov', name:'Governance', meta:'2 of 4', sub:'Approval group'},
  {id:'juya', name:'Juya Kim', sub:'Member'}, {id:'joe', name:'Joe Miller', sub:'Member'},
  {id:'jason', name:'Jason Lee', sub:'Member'}, {id:'david', name:'David Park', sub:'Member'},
  {id:'colossus', name:'Colossus', sub:'Another organization'},
];
const TOKENS = {
  agp:  {sym:'AGP', name:'Ault Platinum', vault:'Ault Treasury, Vault 1', addr:'0x8f3a…c21b', dec:6, color:'#b3bac4', kind:'commodity', asset:'Platinum', unit:'oz', desc:'Allocated platinum bars in segregated storage. 1 token = 1 oz.'},
  apd:  {sym:'APD', name:'Ault Palladium', vault:'Ault Operations, Vault 2', addr:'0x41c0…9e07', dec:6, color:'#c9b48f', kind:'commodity', asset:'Palladium', unit:'oz', desc:'Allocated palladium bars in segregated storage. 1 token = 1 oz.'},
  bmax: {sym:'BMAX', name:'BMAX', vault:'Ault Treasury, Vault 3', addr:'0x5b21…7d4e', dec:8, color:'#f0a23b', kind:'custom', asset:'Bitcoin', unit:'BTC', desc:'Bitcoin held in a segregated custody account. 1 token = 1 BTC.'},
};
// What changes between a metal token and a custom token (Figma AD-C)
const TERMS = {
  commodity: {issue:'Issue', redeem:'Redeem', issueReqs:'Issue requests', redeemReqs:'Redeem requests', per1:'issue', per2:'redemption', words:'Issue and Redeem',
    roleSub:'Who handles issuance and redemption requests for this token.',
    roles:{am:'Confirms redemption amounts, delivery details, and fees with the investor.', mint:'Approves minting for issuance requests.', burn:'Approves burning for redemption requests.', op:'Arranges reserve transfers and asset release, and uploads proof of delivery.'},
    diffRule:'Use different rules for redemption', firstAction:'Issue your first tokens'},
  custom: {issue:'Mint', redeem:'Burn', issueReqs:'Mint requests', redeemReqs:'Burn requests', per1:'mint', per2:'burn', words:'Mint and Burn',
    roleSub:'Who handles mint and burn requests for this token.',
    roles:{am:'Confirms burn amounts, delivery details, and fees with the investor.', mint:'Approves minting for mint requests.', burn:'Approves burning for burn requests.', op:'Checks transfer evidence for mints, and records the BTC payout after each burn.'},
    diffRule:'Use different rules for burns', firstAction:'Mint your first tokens'},
};
const CUSTODIANS = {
  commodity: [
    {id:'tw', ini:'TW', name:'The Wyoming Reserve', where:'Wyoming, manual check', por:true, note:'Requests will use manual settlement to issue and FedEx delivery to redeem.', issueVia:'Manual settlement', redeemVia:'FedEx delivery'},
    {id:'sb', ini:'SB', name:'Seoul Bullion Vault', where:'Korea, API', issueVia:'Manual settlement', redeemVia:'FedEx delivery'},
  ],
  custom: [
    {id:'ad', ini:'AD', name:'Anchorage Digital', where:'custody account, manual check', por:true, note:'Mint requests file a Bitcoin transfer as evidence. Burns pay out BTC from this custody account.', issueVia:'Bitcoin transfer as evidence', redeemVia:'BTC payout after the burn'},
    {id:'bg', ini:'BG', name:'BitGo Trust', where:'API', issueVia:'Bitcoin transfer as evidence', redeemVia:'BTC payout after the burn'},
  ],
};
const ROLES = [['am','Account manager',false],['mint','Mint approver',true],['burn','Burn approver',true],['op','Operator',false]];
const STEPS = ['Token','Details','Backing','Investor terms','Operations','Review'];
const STEP_OF = {ad1:0, ad2:1, ad3:2, ad4:3, ad5:4, ad5b:4, ad6:5};
const STEP_SCREEN = ['ad1','ad2','ad3','ad4','ad5','ad6'];
const NEXT = {ad1:'ad2', ad2:'ad3', ad3:'ad4', ad4:'ad5', ad5:'ad5b', ad5b:'ad6'};
const PREV = {ad2:'ad1', ad3:'ad2', ad4:'ad3', ad5:'ad4', ad5b:'ad5', ad6:'ad5b'};
const STATIC_TASKS = [
  ['Confirm deposit, 2nd check','ISS-0012, 5,000 ASLV. Jason Lee confirmed','3d'],
  ['Approve issuance','ISS-0011, 1,200 ASLV. 1 of 2 approved','3h'],
  ['Confirm the requester by call','RED-0004, 300 ASLV','2h'],
  ['Accept an approval group invite','Treasury signers, from Jason Lee','40m'],
];

const fresh = (kind='commodity') => {
  const tk = kind==='custom' ? 'bmax' : 'agp', t = TOKENS[tk], c0 = CUSTODIANS[kind][0];
  return {
    kind, tokenSrc:'fireblocks', token:tk, addr:'', read:null,
    img:'', imgUrl:'', imgErr:false, name:t.name, desc:t.desc, docs:[],
    custodians:{[c0.id]:true}, holder:'Ault Global Commodities', acct:'', por:null, porErr:null, porFlag:false, showCombo:false,
    who:'any', size:100, issueFee:'', redeemFee:'', excluded:'none', terms:'2 required, 1 optional',
    roles:{am:['gov'], mint:['gov'], burn:['gov'], op:['gov']},
    treasury:'op', feeWallet:'', agreements:'Off',
    executor:'Fireblocks', credential:'treasury', vault:'Vault 1', burnOther:false, burnVault:'Vault 2', vaultId:'', assetId:'', note:'',
    reviewFiles:[], reached:0, from:null,
  };
};

const S = {
  screen:'tokens', persona:'juya', d:fresh(), draftSaved:false,
  reqs:[], cur:null, seq:0,
  rule:'direct', scenario:'none',          // prototype controls
  once:{},                                  // one-shot failures already shown
  modal:null, mf:{}, signing:false, signErr:false,
  notes:[], notifOpen:false, menu:null, tip:false, done1:false, done2:false,
  errs:{}, fromReview:false, task:null, taskTab:'todo', protoMin:true, refused:false,
};

/* ================= helpers ================= */
const me = () => PEOPLE[S.persona];
const tkOf = d => TOKENS[d.token] || TOKENS.agp;
const sym = (d=S.d) => d.tokenSrc==='self' && d.read?.sym ? d.read.sym : tkOf(d).sym;
const T = (d=S.d) => TERMS[d.kind];
const custList = (d=S.d) => CUSTODIANS[d.kind];
const custNames = (d=S.d) => custList(d).filter(c=>d.custodians[c.id]).map(c=>c.name);
const porCust = (d=S.d) => custList(d).find(c=>c.por && d.custodians[c.id]);
const rolePeople = (d=S.d) => { const s=new Set(); Object.values(d.roles).flat().forEach(x=>s.add(x)); return [...s].map(id=>MEMBERS.find(m=>m.id===id).name); };
const feeSet = (d=S.d) => (+d.issueFee>0) || (+d.redeemFee>0);
const getR = (id=S.cur) => S.reqs.find(r=>r.id===id);
const scen = k => S.scenario===k;
const badge = (tone, txt) => `<span class="badge b-${tone}">${esc(txt)}</span>`;
const err = (key, msg) => msg ? `<span class="err" id="err-${key}">${esc(msg)}</span>` : '';
const bad = key => S.errs[key] ? 'bad' : '';
function toast(msg){ const t=document.createElement('div'); t.className='toast'; t.textContent=msg; document.body.appendChild(t); setTimeout(()=>t.remove(), 2600); }
function note(to, icon, title, sub, go, id){ S.notes.unshift({to, icon, title, sub, go, id, at:Date.now(), read:false}); }
function tokenImg(d, size){
  if (d.img) return `<img src="${esc(d.img)}" alt="" width="${size}" height="${size}" style="border-radius:12px;object-fit:cover;flex:none">`;
  return `<img src="assets/token-sample-${size===44?44:56}.svg" width="${size}" height="${size}" alt="" style="flex:none">`;
}
function banner(tone, title, body, extra=''){
  const icon = {ok:'check', crit:'alert-circle', att:'alert-triangle', prog:'clock', neu:'undo-2'}[tone];
  return `<div class="banner ${tone==='ok'?'':tone}" role="status"><span class="c"><i data-lucide="${icon}"></i></span><div class="grow"><b>${esc(title)}</b><span>${body}</span></div>${extra}</div>`;
}
function sel(bind, opts, val, extra=''){ return `<select class="select ${bad(bind)}" data-bind="${bind}" ${extra}>${opts.map(o=>{const [v,l]=Array.isArray(o)?o:[o,o];return `<option value="${esc(v)}" ${v===val?'selected':''}>${esc(l)}</option>`}).join('')}</select>`; }
function go(screen, extra){
  Object.assign(S, {screen, menu:null, tip:false, errs:{}}, extra||{});
  if (STEP_OF[screen]!=null) S.d.reached = Math.max(S.d.reached, STEP_OF[screen]);
  if (screen==='ad6') S.fromReview = false;
  render(); window.scrollTo(0,0);
}

/* ================= draft chrome ================= */
function stepMeta(i){
  const d = S.d, pr = rolePeople(d).length;
  return [ `${sym(d)}, Mainnet`, d.docs.length ? `${d.docs.length} document${d.docs.length>1?'s':''}` : 'No documents',
    d.porFlag && !d.por ? 'Needs a new custody statement' : (custNames(d)[0]||'').replace(/^The /,''),
    `${d.size} ${sym(d)} steps`, `${pr} role${pr>1?'s':''}`, ''][i];
}
function steps(cur){
  let h = '<div class="card"><div class="steps">';
  STEPS.forEach((n,i)=>{
    const reach = i <= S.d.reached && i !== cur, done = i < cur || reach;
    const flag = i===2 && S.d.porFlag && !S.d.por;
    if (i) h += `<div class="conn ${i<=Math.max(cur,0)?'on':''}"></div>`;
    h += `<button class="step ${done?'done':''} ${i===cur?'cur':''} ${flag?'flag':''}" ${done?`data-a="step" data-v="${i}"`:'disabled'}>
      <span class="dotn">${done?'<img src="assets/check.svg" alt="">':i+1}</span>
      <span><span class="nm">${n}</span>${done?`<span class="meta" style="display:block">${esc(stepMeta(i))}</span>`:''}</span></button>`;
  });
  return h + '</div></div>';
}
function rhead(d, title, sub, right=''){
  return `<div class="rhead">${tokenImg(d,56)}<div class="grow"><h1>${esc(title)}</h1><div class="sub">${esc(sub)}</div></div>${right}</div>`;
}
function draftHead(){
  const d = S.d;
  return S.screen==='ad1' && d.reached===0 ? rhead(d,'New token','Listing draft, saved in this browser') : rhead(d, d.name||'New token', `${sym(d)}, draft saved in this browser`);
}
function footer(next, {back=true, label='Continue', disabled=false, danger=false}={}){
  if (S.fromReview && next!=='submit') label = 'Back to review';
  return `<div class="footer"><button class="link" data-a="save">Save and exit</button><button class="link danger" data-a="discard">Discard draft</button><span class="grow"></span>
  ${back?'<button class="btn" data-a="back">Back</button>':''}<button class="btn ${danger?'danger':'primary'}" data-a="next" data-v="${next}" ${disabled?'disabled':''}>${label}</button></div>`;
}
const wrap = (cur, body, next, opts) => `<button class="back" data-a="go" data-v="tokens">← Your tokens</button>${draftHead()}${steps(cur)}${body}${footer(next, opts)}`;

function summaryRows(d, edit, flagBacking){
  const rows = [
    ['Token', `${d.name} (${sym(d)}) on Ault Mainnet`, 'ad1'],
    ['Investors see', `${d.name}, ${d.docs.length ? d.docs.length+' public document'+(d.docs.length>1?'s':'') : 'no public documents'}`, 'ad2'],
    ['Backed by', custNames(d).join(', ') + (flagBacking ? '. Custody statement flagged' : (d.porFlag && !d.por ? '. Upload a new custody statement' : '')), 'ad3', flagBacking || (d.porFlag && !d.por)],
    ['Investor terms', `${d.who==='any'?'Any KYC-verified investor':'Only investors you approve'}, steps of ${d.size} ${sym(d)}`, 'ad4'],
    ['Roles', rolePeople(d).join(', '), 'ad5'],
    ['Signing', `${d.vault} by ${d.executor}`, 'ad5b'],
    ['Wallets', feeSet(d) ? 'Treasury wallet, fee wallet' : 'Treasury wallet', 'ad5'],
  ];
  return rows.map(([k,v,s,f])=>`<div class="sum"><span class="k">${k}</span><span class="v ${f?'flag':''}">${esc(v)}</span>${edit?`<button class="link" data-a="edit" data-v="${s}">Edit</button>`:'<span></span>'}</div>`).join('');
}

/* ================= validation (Figma AD1x–AD5x) ================= */
const ADDR_RE = /^0x[0-9a-fA-F]{40}$/;
const FEE_RE = /^\d*(\.\d{0,6})?$/;
function validate(screen){
  const d = S.d, e = {};
  if (screen==='ad1'){
    if (d.tokenSrc==='self'){
      if (!d.addr) e.addr = 'Enter the contract address.';
      else if (!ADDR_RE.test(d.addr)) e.addr = 'Must be a 0x-prefixed 40-character address';
      else if (d.read?.state!=='ok') e.addr = d.read?.state==='reading' ? 'Wait until the contract is read.' : (d.read?.msg || 'Read the contract first.');
    } else if (scen('fbFail') || scen('noFbTokens')) e.token = 'Pick a token to continue.';
  }
  if (screen==='ad2'){
    if (!d.name.trim()) e.name = 'Add a public name. Investors see it on the token page.';
  }
  if (screen==='ad3'){
    if (scen('custFail') || scen('noCustodian')) e.cust = 'Pick a custodian to continue.';
    else if (!custNames(d).length) e.cust = 'Select at least one custodian.';
    else if (porCust(d) && !d.por) e.por = 'Upload the proof of reserve to continue.';
  }
  if (screen==='ad4'){
    if (!(Number(d.size)>0)) e.size = 'Enter a size above 0.';
    ['issueFee','redeemFee'].forEach(k=>{ if (!FEE_RE.test(d[k])) e[k] = 'USDT counts in 6 decimals. Use up to 6 decimal places.'; });
  }
  if (screen==='ad5'){
    if (!d.roles.mint.length) e.mint = 'Add at least one.';
    if (!d.roles.burn.length) e.burn = 'Add at least one.';
    if (feeSet(d) && !d.feeWallet) e.feeWallet = 'Choose the wallet fees are paid to, or set both fees to 0.';
  }
  if (screen==='ad5b'){
    if (scen('noVault')) e.vault = `No vault in this workspace holds ${sym(d)}_AULT. Create its wallet in a Fireblocks vault first.`;
    if (scen('noAsset')) e.vault = 'No Fireblocks asset is linked to this token’s contract. Add the asset in Fireblocks, then try again.';
    if (scen('fbNoAnswer')){ if (!d.vaultId.trim()) e.vaultId = 'Enter the vault account ID.'; if (!d.assetId.trim()) e.assetId = 'Enter the asset ID.'; }
  }
  return e;
}
function reviewBlocked(){
  return scen('kycTodo') || scen('waitingPlatform') || scen('kybExpired') || (porCust() && !S.d.por);
}

/* ================= screens ================= */
const V = {};

V.tokens = () => {
  const d = S.d, rows = [];
  const draftStep = STEP_SCREEN[Math.min(d.reached,5)];
  if (S.draftSaved) rows.push(`<div class="lrow" data-a="go" data-v="${draftStep}"><div class="idn"><span class="tile">DFT</span><div><b>${esc(d.name||'Untitled token')}</b><span>Draft saved in this browser only</span></div></div><div>${badge('neu','Draft')}</div><div style="display:flex;gap:8px;justify-content:flex-end;align-items:center"><button class="btn" data-a="go" data-v="${draftStep}">Continue</button><button class="link" style="color:var(--muted)" aria-label="Delete draft" data-a="deleteDraft"><i data-lucide="trash-2" style="width:16px"></i></button></div><i data-lucide="chevron-right" class="muted" style="width:16px"></i></div>`);
  [...S.reqs].reverse().filter(r=>r.status!=='live').forEach(r=>{
    const m = {
      org:['prog','Org approval',`Waiting on Governance, ${r.approvals.length} of 2`],
      review:['prog','In platform review',`Submitted ${fmt(r.at.submitted)}`],
      rejected:['crit','Rejected','Custody statement flagged'],
      withdrawn:['neu','Withdrawn',`Withdrawn ${fmt(r.at.withdrawn)} by ${r.by}`],
      orgRejected:['crit','Rejected', r.platformRefused ? 'Refused by the platform' : `Rejected by ${r.rejBy}`],
      propWithdrawn:['neu','Withdrawn',`Proposal withdrawn ${fmt(r.at.withdrawn)}`],
    }[r.status];
    const act = r.status==='rejected' ? `<button class="btn" data-a="restart" data-v="${r.id}">Start a new draft</button>` : '';
    rows.push(`<div class="lrow ${r.id===S.cur&&r.fresh?'hl':''}" data-a="openReq" data-v="${r.id}"><div class="idn"><span class="tile">${esc(sym(r.d))}</span><div><b>${esc(r.d.name)}</b><span>${esc(m[2])}</span></div></div><div>${badge(m[0],m[1])}</div><div style="text-align:right">${act}</div><i data-lucide="chevron-right" class="muted" style="width:16px"></i></div>`);
  });
  rows.push(`<div class="lrow" data-a="soon"><div class="idn"><span class="tile">APD</span><div><b>Ault Palladium</b><span>Custody agreement expired</span></div></div><div>${badge('crit','Rejected')}</div><div style="text-align:right"><button class="btn" data-a="soon">Start a new draft</button></div><i data-lucide="chevron-right" class="muted" style="width:16px"></i></div>`);
  const listed = [
    ...S.reqs.filter(r=>r.status==='live').map(r=>({img:tokenImg(r.d,28), name:r.d.name, s:sym(r.d), st:['pos','Active'], sup:'0', res:100, pend:'0 / 0', id:r.id})),
    {coin:'#b3bac4', name:'Ault Silver', s:'ASLV', st:['pos','Active'], sup:'5,000', res:100, pend:'+3,200 / −600'},
    {coin:'#d9b44a', name:'Ault Gold', s:'AGLD', st:['att','Suspended'], sup:'800', res:100, pend:'0 / 0'},
  ];
  const locked = scen('noRights');
  const addBtn = locked
    ? `<div class="tipwrap"><button class="btn primary" aria-disabled="true" aria-describedby="addtip" data-a="tip"><i data-lucide="lock"></i>Add token</button>${S.tip?`<div class="tip" id="addtip" role="tooltip"><b>You can’t add tokens</b>Listing a token needs listing rights for Ault Global Commodities. Ask Joe Miller.</div>`:''}</div>`
    : `<button class="btn primary" data-a="addToken">Add token</button>`;
  return `
  <div style="display:flex;align-items:flex-start;gap:16px"><div class="grow"><h1>Tokens</h1><div class="sub" style="margin-top:6px">Manage your tokens and follow listing requests.</div></div>${addBtn}</div>
  ${scen('noKyc') ? banner('att','Confirm your identity before listing a token','You can see your organization’s tokens and requests. Listing needs your own KYC.','<button class="btn" data-a="soon">Verify identity</button>') : ''}
  <div class="tabs"><button class="tab on">Your tokens <span class="n">${listed.length+rows.length}</span></button><button class="tab" data-a="soon">All listed <span class="n">12</span></button></div>
  <div class="card"><div class="card-h" style="padding-bottom:12px"><h2 style="font-size:16px">Listed <span class="muted" style="font-weight:400">${listed.length}</span></h2></div>
    <div class="thead"><span>Token</span><span>Status</span><span style="text-align:right">Supply</span><span>Reserve</span><span style="text-align:right">Pending</span><span></span></div>
    ${listed.map(r=>`<div class="trow" ${r.id?`data-a="openToken" data-v="${r.id}"`:'data-a="soon"'}><div class="idn">${r.img||`<span class="tile" style="border-radius:999px"><span class="coin" style="background:${r.coin}"></span></span>`}<div><b>${esc(r.name)}</b><span>${esc(r.s)}</span></div></div>

function reqProgress(r){
  const org = r.path==='org', s = r.status;
  const items = [];
  if (org) items.push(['Proposed', `${fmt(r.at.proposed)} by ${r.by}`], ['Org approval', s==='org' ? `${r.approvals.length} of 2, Governance` : (r.at.orgApproved ? `Approved ${fmt(r.at.orgApproved)}` : 'Governance, 2 of 4')]);
  else items.push(['Submitted', `${fmt(r.at.submitted)} by ${r.by}`]);
  items.push(['Platform review', org && !r.at.submitted ? 'After org approval' : '1 to 2 business days'], ['Live','Opens in Your tokens']);
  const base = org ? 1 : 0; // index of the stage after "submitted/proposed"
  let cur, stop = null;
  if (s==='org') cur = 1;
  else if (s==='review') cur = base+1;
  else if (s==='live') cur = items.length;
  else if (s==='rejected') { cur = base+1; stop='stop'; }
  else if (s==='withdrawn') { cur = base+1; stop='stopn'; }
  else if (s==='orgRejected') { cur = 1; stop='stop'; }
  else if (s==='propWithdrawn') { cur = 1; stop='stopn'; }
  return `<div class="card"><div class="rp">${items.map(([b,sp],i)=>{
    const cls = i<cur ? 'done' : i===cur ? (stop||'cur') : '';
    const inner = cls==='done' ? '<img src="assets/check.svg" alt="">' : (cls==='stop'||cls==='stopn') ? '×' : '';
    return `${i?`<div class="conn ${i<=cur&&!(stop&&i===cur)?'on':''}" style="flex:1"></div>`:''}<div class="s"><span class="ring ${cls}">${inner}</span><div><b style="${i>cur?'color:var(--muted)':''}">${b}</b><span>${esc(sp)}</span></div></div>`;
  }).join('')}</div></div>`;
}
function others(by){ const o = GOVERNANCE.filter(n=>n!==by); return o.slice(0,-1).join(', ') + ' or ' + o.at(-1); }

        ${[['Signing',`${d.vault} by ${d.executor}`],['Roles',rolePeople(d).join(', ')],['Template','Fireblocks ERC-20F'],['Token',`${d.name} (${sym(d)})`]].map(([k,v])=>`<div class="sum" style="grid-template-columns:140px 1fr"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('')}
        <div style="padding:12px 24px;border-top:1px solid var(--border)"><button class="link" data-a="openReq" data-v="${r.id}" data-back="tasks">Open the full proposal →</button></div></div>
    </div>`;
  } else if (t) detail = `<div class="card" style="padding:24px"><h2 style="margin:0 0 4px;font-size:18px">${esc(t.title)}</h2><div class="hint">${esc(t.sub)}</div><p class="small muted">This task isn’t part of the Add Token prototype.</p></div>`;
  return `<div><h1>My tasks</h1></div>
  <div class="tabs"><button class="tab ${S.taskTab==='todo'?'on':''}" data-a="taskTab" data-v="todo">To do <span class="n">${todo.length}</span></button><button class="tab ${S.taskTab==='done'?'on':''}" data-a="taskTab" data-v="done">Done <span class="n">${done.length}</span></button></div>
  <div class="tasks"><div class="card">${list.map(x=>`<button class="titem ${x.id===S.task?'on':''}" data-a="task" data-v="${x.id}"><span class="grow"><b>${esc(x.title)}</b><span>${esc(x.sub)}</span></span><time>${esc(x.ago)}</time></button>`).join('') || '<div class="hint" style="padding:16px">Nothing here yet.</div>'}</div>${detail}</div>`;
};

function signRow(who){

  if (scen('passkeyOther') && !S.once.passkeyOther) return `<div class="msign"><span class="ico" style="background:#fff"><i data-lucide="smartphone"></i></span><div class="grow"><b style="font-weight:600">Your passkey is on another device</b><div class="hint">Use your phone or the computer that holds it. Your browser shows a QR code to scan. Nothing is submitted until you sign.</div></div></div>`;
  return `<div class="msign"><span class="ico" style="background:#fff"><i data-lucide="key-round"></i></span><div><b style="font-weight:600">${S.signing?'Waiting for your passkey…':'Sign with your passkey'}</b><div class="hint">${esc(who)}, for Ault Global Commodities</div></div></div>`;
}
function signBtn(label, act, danger){
  if (S.signErr) return `<button class="btn primary" data-a="${act}">Try again</button>`;
  if (scen('passkeyOther') && !S.once.passkeyOther) return `<button class="btn primary" data-a="otherDevice" data-v="${act}">Use another device</button>`;
  return `<button class="btn ${danger?'danger':'primary'}" data-a="${act}" ${S.signing?'disabled':''}>${S.signing?'<span class="spin"></span>Signing':label}</button>`;
}
const mrows = rows => rows.map(([k,v])=>`<div class="mrow"><span class="k">${k}</span><span class="v">${esc(v)}</span></div>`).join('');
const modalWrap = (inner, label) => `<div class="scrim" data-a="closeModal"><div class="modal" role="dialog" aria-modal="true" aria-label="${esc(label)}">${inner}</div></div>`;
const cancelBtn = (txt='Cancel') => `<button class="btn" data-a="closeModal" ${S.signing?'disabled':''}>${txt}</button>`;

function modalHTML(){
  const m = S.modal; if (!m) return '';

      ${signRow(me().name)}<div class="mfoot">${cancelBtn('Keep request')}${signBtn('Sign and withdraw','signWithdraw',true)}</div>`, 'Withdraw request');

      ${signRow(me().name)}<div class="mfoot">${cancelBtn('Keep reviewing')}${signBtn('Sign and approve','signApprove')}</div>`, 'Approve proposal');

      <div class="mbody"><label class="label" for="rr">Reason <span class="req">*</span></label><textarea class="input ${S.errs.rejReason?'bad':''}" id="rr" data-mf="rejReason" placeholder="e.g. Wait for the Q4 audit before listing.">${esc(S.mf.rejReason||'')}</textarea>${S.errs.rejReason?err('rejReason','Add a reason. Everyone in Governance sees it.'):'<span class="hint">Everyone in Governance sees this reason.</span>'}</div>
      ${signRow(me().name)}<div class="mfoot">${cancelBtn('Keep reviewing')}${signBtn('Sign and reject','signReject',true)}</div>`, 'Reject proposal');
  if (m.type==='platformRefused') return modalWrap(`<div class="mh"><h3 style="color:var(--danger)">The platform refused the listing request</h3><p>It was not sent. Reason from the platform: a contract address is 0x followed by 40 hex characters. ${esc(r.by)} needs to fix the draft and propose again.</p></div>
      <div class="mfoot"><button class="btn primary" data-a="closeModal">Close</button></div>`, 'Refused');
  if (m.type==='discard') return modalWrap(`<div class="mh"><h3>Discard this draft?</h3><p>Everything you entered for ${esc(d.name||'this token')} is removed from this browser.</p></div>
      <div class="mfoot">${cancelBtn('Keep editing')}<button class="btn danger" data-a="discardOk">Discard draft</button></div>`, 'Discard');
  if (m.type==='deleteDraft') return modalWrap(`<div class="mh"><h3>Delete this draft?</h3><p>${esc(d.name||'Untitled token')} and its attached files are removed from this device.</p></div>
      <div class="mfoot">${cancelBtn('Keep draft')}<button class="btn danger" data-a="discardOk">Delete draft</button></div>`, 'Delete draft');
  if (m.type==='newOverDraft') return modalWrap(`<div class="mh"><h3>Start a new token?</h3><p>You have an unfinished draft (${esc(d.name||'Untitled token')}). Starting a new token deletes that draft and its attached files from this device.</p></div>
      <div class="mfoot"><button class="btn" data-a="continueDraft">Continue the draft</button><button class="btn danger" data-a="replaceDraft">Delete draft and start new</button></div>`, 'Start new');
  if (m.type==='kyc') return modalWrap(`<div class="mh"><h3>Confirm your identity before listing a token</h3><p>Listing needs your own KYC. It takes about 3 minutes.</p></div>
      <div class="mfoot">${cancelBtn('Close')}<button class="btn primary" data-a="soon">Verify identity</button></div>`, 'Verify identity');
  return '';
}

/* ================= render ================= */
function render(){
  const a = document.activeElement, fid = a && a.id, ss = a && a.selectionStart, se = a && a.selectionEnd;
  $('#app').innerHTML = (V[S.screen]||V.tokens)();
  $('#layer').innerHTML = modalHTML() + notifHTML();
  const p = $('#proto'); p.classList.toggle('min', S.protoMin); p.innerHTML = protoHTML();
  $('#unread').hidden = !S.notes.some(n=>n.to===S.persona && !n.seen);
  $('#ini').textContent = me().ini; $('#pname').textContent = me().name; $('#pmail').textContent = me().mail;
  $('#taskcount').textContent = myTasks().length;
  const navOn = S.screen==='home' ? 'home' : S.screen==='tasks' ? 'tasks' : 'tokens';
  document.querySelectorAll('.side .nav').forEach(b=>b.classList.toggle('on', b.dataset.nav===navOn));
  if (window.lucide) lucide.createIcons();
  if (fid){ const el = document.getElementById(fid); if (el){ el.focus(); try{ el.setSelectionRange(ss,se); }catch(_){} } }
}

/* ================= actions ================= */
function newReq(){
  const r = {id:++S.seq, d:clone(S.d), by:me().name, path:S.rule, status:S.rule==='org'?'org':'review', approvals:[], at:{}, fresh:true};
  if (r.path==='org'){ r.at.proposed = Date.now(); r.approvals.push(me().name); }
  else r.at.submitted = Date.now();
  S.reqs.forEach(x=>x.fresh=false);
  S.reqs.push(r); S.cur = r.id; S.draftSaved = false; S.d = fresh(S.d.kind);
  if (r.path==='org') note(S.persona==='juya'?'joe':'juya','users-round',`${r.by} proposed listing ${r.d.name}`,'Your approval is needed. 1 of 2 approved','task',r.id);
  return r;
}
function sign(then){
  S.signing = true; S.signErr = false; render();
  setTimeout(()=>{
    S.signing = false;
    if (scen('passkeyFail') && !S.once.passkeyFail){ S.once.passkeyFail = true; S.signErr = true; render(); return; }
    then();
  }, 1300);
}
function closeModal(){ S.modal=null; S.signErr=false; S.mf={}; S.errs={}; }
function startNew(){
  if (scen('noKyc')){ S.modal={type:'kyc'}; render(); return; }
  if (S.draftSaved){ S.modal={type:'newOverDraft'}; render(); return; }
  go('ad0');
}
function restartFrom(r){
  const d = clone(r.d);
  d.reached = 5;
  if (r.status==='rejected'){ d.por = null; d.porFlag = true; d.from = {type:'rejected', at:r.at.submitted}; }
  else d.from = {type:'orgRejected', at:r.at.decided, by:r.rejBy, reason:r.rejReason};
  S.d = d; S.draftSaved = true; S.rule = r.path; go('ad6');
}
function startRead(){
  const d = S.d; clearTimeout(startRead.t);
  d.read = {state:'reading'}; render();
  startRead.t = setTimeout(()=>{
    const custom = d.kind==='custom';
    if (scen('addrNoAnswer') && !S.once.addr) { S.once.addr=1; d.read = {state:'noAnswer', msg:'Nothing answered at that address on this network. Check the address, or the network it was deployed to.'}; }
    else if (scen('addrNetFail') && !S.once.addr) { S.once.addr=1; d.read = {state:'netFail', msg:'Couldn’t reach Ault Mainnet, so nothing was read. Check your connection, then try again.'}; }
    else if (scen('addrListed')) d.read = {state:'listed', msg:'This contract is already listed as Ault Silver (ASLV). Open it from Your tokens instead.'};
    else { d.read = {state:'ok', sym: custom?'BMAX':'AGP', name: custom?'BMAX':'Ault Platinum', dec: custom?8:6}; d.name = d.read.name; }
    if (S.screen==='ad1') render();
  }, 1200);
}

const A = {
  soon(){ toast('Not part of this prototype'); },
  go(v){ S.notifOpen=false; S.backTo=null; go(v); },
  step(v){ go(STEP_SCREEN[+v]); },
  edit(v){ S.fromReview = true; go(v); S.fromReview = true; render(); },
  toggle(v){ S[v]=!S[v]; render(); },
  tip(){ S.tip=!S.tip; render(); },
  addToken(){ startNew(); },
  start(){ S.d = fresh(); S.draftSaved = false; S.refused=false; go('ad1'); },
  continueDraft(){ closeModal(); go(STEP_SCREEN[Math.min(S.d.reached,5)]); },
  replaceDraft(){ closeModal(); S.draftSaved=false; S.d=fresh(); go('ad0'); },
  startNew(){ startNew(); },
  next(v){
    if (v==='submit'){ S.modal={type:'submit'}; render(); return; }
    const e = validate(S.screen);
    if (Object.keys(e).length){ S.errs = e; render(); const f = document.querySelector('.bad, .err'); f && f.scrollIntoView({block:'center', behavior:'smooth'}); return; }
    go(S.fromReview ? 'ad6' : v);
  },
  back(){ go(PREV[S.screen]||'tokens'); },
  save(){ S.draftSaved=true; go('tokens'); toast('Draft saved in this browser'); },
  discard(){ S.modal={type:'discard'}; render(); },
  deleteDraft(){ S.modal={type:'deleteDraft'}; render(); },
  discardOk(){ closeModal(); S.draftSaved=false; S.d=fresh(); go('tokens'); toast('Draft deleted'); },
  closeModal(v,t,e){ if (t.classList.contains('scrim') && e.target!==t) return; if (S.signing) return; closeModal(); render(); },
  kind(v){ if (S.d.kind===v) return; const keep = {reached:S.d.reached, tokenSrc:S.d.tokenSrc}; S.d = Object.assign(fresh(v), keep); render(); },
  src(v){ S.d.tokenSrc=v; S.errs={}; render(); },
  token(v){ const t=TOKENS[v]; Object.assign(S.d,{token:v, name:t.name, desc:t.desc}); render(); },
  readAgain(){ startRead(); },
  retry(){ S.scenario='none'; toast('Loaded'); render(); },
  cust(v){ S.d.custodians[v]=!S.d.custodians[v]; delete S.errs.cust; render(); },
  combo(){ S.d.showCombo=!S.d.showCombo; render(); },
  rmPor(){ S.d.por=null; S.d.porErr=null; render(); },
  clearImg(){ Object.assign(S.d,{img:'',imgUrl:'',imgErr:false}); render(); },
  rmDoc(v){ S.d.docs.splice(+v,1); render(); },
  who(v){ S.d.who=v; render(); },
  size(v){ S.d.size=+v; delete S.errs.size; render(); },
  addRole(v,t,e){ e.stopPropagation(); S.menu = S.menu===v?null:v; render(); },
  pick(v){ const [k,id]=v.split(':'); S.d.roles[k].push(id); S.menu=null; render(); },
  rmRole(v){ const [k,id]=v.split(':'); S.d.roles[k]=S.d.roles[k].filter(x=>x!==id); render(); },
  burnOther(){ S.d.burnOther=!S.d.burnOther; render(); },
  otherDevice(v){ S.once.passkeyOther = true; A[v](); },
  signSubmit(){
    sign(()=>{
      if (scen('serverRefused') && !S.once.refused){ S.once.refused=true; S.refused=true; closeModal(); go('ad6'); return; }
      S.refused=false; const r = newReq(); closeModal(); S.backTo=null; go('ad7');
      toast(r.path==='org' ? 'Proposal sent to Governance' : 'Submitted for review');
    });
  },
  openReq(v,t){ S.cur=+v; S.backTo = t.dataset.back||null; const r=getR(); if (r) r.fresh = r.fresh && r.status==='review'; S.notifOpen=false; go('ad7'); },
  openToken(v){ S.cur=+v; S.notifOpen=false; go('ad8'); },
  restart(v){ const r=getR(+v); if (S.draftSaved){ S.modal={type:'newOverDraft'}; render(); return; } restartFrom(r); },
  seeDecision(v){ const r=getR(+v); r.race=false; render(); },
  withdrawReq(v){ S.modal={type:'withdrawReq', rid:+v}; S.mf={}; render(); },
  signWithdraw(){
    const r = getR(S.modal.rid);
    sign(()=>{
      r.fresh=false;
      if (scen('raceLive')){ r.status='live'; r.race=true; r.at.decided=Date.now(); }
      else if (scen('raceRejected')){ r.status='rejected'; r.race=true; r.at.decided=Date.now(); }
      else { r.status='withdrawn'; r.at.withdrawn=Date.now(); r.reason=(S.mf.reason||'').trim(); }
      closeModal(); go('ad7');
    });
  },
  withdrawProp(v){ S.modal={type:'withdrawProp', rid:+v}; render(); },
  confirmWithdrawProp(){ const r=getR(S.modal.rid); r.status='propWithdrawn'; r.at.withdrawn=Date.now(); closeModal(); go('ad7'); },
  approve(v){ S.modal={type:'approve', rid:+v}; render(); },
  signApprove(){
    const r = getR(S.modal.rid);
    sign(()=>{
      r.decidedBy = me().name; r.at.decided = Date.now();
      if (scen('platformRefused')){
        r.status='orgRejected'; r.platformRefused=true; r.rejBy=me().name; r.rejReason='Reason from the platform: a contract address is 0x followed by 40 hex characters.';
        note(r.by==='Juya Kim'?'juya':'joe','alert-circle','The platform refused your listing request', `${r.d.name}. Fix the draft and propose again.`,'req',r.id);
        S.modal={type:'platformRefused', rid:r.id}; render(); return;
      }
      r.approvals.push(me().name); r.status='review'; r.at.orgApproved=Date.now(); r.at.submitted=Date.now();
      note(r.by==='Juya Kim'?'juya':'joe','check',`Governance approved ${r.d.name}`,'The listing request went to the platform','req',r.id);
      closeModal(); S.taskTab='done'; S.task='d'+r.id; go('tasks'); toast('Approved. The listing request went to the platform.');
    });
  },
  reject(v){ S.modal={type:'reject', rid:+v}; S.mf={}; render(); },
  signReject(){
    const r = getR(S.modal.rid), why = (S.mf.rejReason||'').trim();
    if (!why){ S.errs={rejReason:1}; render(); document.getElementById('rr')?.focus(); return; }
    sign(()=>{
      r.status='orgRejected'; r.rejBy=me().name; r.rejReason=why; r.decidedBy=me().name; r.at.decided=Date.now();
      note(r.by==='Juya Kim'?'juya':'joe','x-circle',`${me().name} rejected your listing proposal`, why,'req',r.id);
      closeModal(); S.taskTab='done'; S.task='d'+r.id; go('tasks'); toast('Proposal rejected');
    });
  },
  task(v){ S.task=v; render(); },
  taskTab(v){ S.taskTab=v; S.task=null; render(); },
  bell(v,t,e){ e.stopPropagation(); S.notifOpen=!S.notifOpen; if (S.notifOpen) S.notes.filter(n=>n.to===S.persona).forEach(n=>n.seenSoon=true); else S.notes.forEach(n=>{ if(n.seenSoon) n.seen=true; }); render(); },
  openNote(v){
    const n = S.notes[+v]; n.seen = true; S.notifOpen=false;
    if (n.go==='task'){ S.taskTab='todo'; S.task='r'+n.id; go('tasks'); }
    else if (n.go==='token'){ S.cur=n.id; go('ad8'); }
    else { S.cur=n.id; S.backTo=null; go('ad7'); }
  },
  /* prototype panel */
  protoMin(){ S.protoMin=!S.protoMin; render(); },
  persona(v){ if (S.persona===v) return; S.persona=v; S.notifOpen=false; closeModal(); S.backTo=null; S.taskTab='todo'; S.task=null; go(myTasks().some(t=>t.rid) ? 'tasks' :(S.screen==='ad7'||S.screen==='ad8') ? S.screen : 'tokens'); toast(`${me().name}(으)로 보는 중`); },
  rule(v){ S.rule=v; render(); },
  platform(v){
    const r = [...S.reqs].reverse().find(x=>x.status==='review'); if (!r) return;
    r.fresh=false; r.at.decided=Date.now();
    const to = r.by==='Juya Kim'?'juya':'joe';
    if (v==='approve'){ r.status='live'; note(to,'check',`${r.d.name} is listed`, `Approved by the platform. ${T(r.d).firstAction}.`,'token',r.id); }
    else { r.status='rejected'; note(to,'x-circle',`${r.d.name} listing was rejected`,'Custody statement flagged. See the decision.','req',r.id); }
    S.persona = to; go('home'); toast(v==='approve'?'플랫폼이 승인했습니다. 종 알림을 확인하세요.':'플랫폼이 거절했습니다. 종 알림을 확인하세요.');
  },
  reset(){ location.reload(); },
};

document.addEventListener('click', e => {
  const t = e.target.closest('[data-a]');
  if (!t){
    let dirty = false;
    if (S.menu){ S.menu=null; dirty=true; }
    if (S.tip){ S.tip=false; dirty=true; }
    if (S.notifOpen && !e.target.closest('.notif')){ A.bell(null,null,{stopPropagation(){}}); return; }
    if (dirty) render();
    return;
  }
  if (t.getAttribute('aria-disabled')==='true' && t.dataset.a!=='tip') return;
  (A[t.dataset.a] || A.soon)(t.dataset.v, t, e);
});

document.addEventListener('input', e => {
  const el = e.target;
  if (el.dataset.mf){ S.mf[el.dataset.mf] = el.value; if (S.errs[el.dataset.mf]){ delete S.errs[el.dataset.mf]; document.getElementById('err-'+el.dataset.mf)?.remove(); el.classList.remove('bad'); } return; }
  const b = el.dataset.bind; if (!b || el.tagName==='SELECT') return;
  const d = S.d; d[b] = el.value;
  if (S.errs[b]){ delete S.errs[b]; document.getElementById('err-'+b)?.remove(); el.classList.remove('bad'); }
  if (b==='name'){ const pv=$('#pv-name'); if (pv) pv.textContent = d.name || 'Token name'; const h=$('.rhead h1'); if (h) h.textContent = d.name || 'New token'; }
  if (b==='desc'){ const pv=$('#pv-desc'); if (pv) pv.textContent = d.desc; }
  if (b==='size'){ const n=Number(d.size)||0; $('#size-hint').textContent = n>0?`Investors request ${n}, ${n*2}, ${n*3} ${sym()}…`:''; }
  if (b==='issueFee' || b==='redeemFee'){ if (!e.isComposing) render(); }
  if (b==='addr'){ d.read = null; const v = el.value.trim(); if (ADDR_RE.test(v)) startRead(); }
});
document.addEventListener('change', e => {
  const el = e.target;
  if (el.dataset.proto==='scenario'){ S.scenario = el.value; S.once = {}; S.refused=false; S.tip=false; render(); toast(el.value==='none'?'정상 상황':'상황: '+el.options[el.selectedIndex].text); return; }
  if (el.dataset.bind && el.tagName==='SELECT'){ S.d[el.dataset.bind]=el.value; delete S.errs[el.dataset.bind]; render(); return; }
  if (el.dataset.bind==='imgUrl'){
    const u = el.value.trim(), d = S.d;
    if (!u){ d.imgErr=false; if (!d.img.startsWith('blob:')) d.img=''; render(); return; }
    const img = new Image();
    img.onload = () => { d.img = u; d.imgErr = false; render(); };
    img.onerror = () => { d.imgErr = true; render(); };
    img.src = u; return;
  }
  if (el.dataset.bind==='addr'){ const v=el.value.trim(); S.d.addr=v; if (v && !ADDR_RE.test(v)){ S.errs.addr='Must be a 0x-prefixed 40-character address'; render(); } return; }
  if (el.dataset.bind==='size'){ render(); return; }
  const f = el.dataset.file; if (!f || !el.files.length) return;
  takeFiles(f, [...el.files]);
});
function takeFiles(kind, files){
  const d = S.d;
  if (kind==='por'){
    const f = files[0];
    if (f.size > 50*1048576){ d.por=null; d.porErr = `${f.name} is ${Math.round(f.size/1048576)} MB. The limit is 50 MB.`; render(); return; }
    if (!/\.(pdf|png|jpe?g)$/i.test(f.name)){ d.por=null; d.porErr = `${f.name} isn't a PDF, PNG or JPG.`; render(); return; }
    d.por = {name:f.name, size:f.size}; d.porErr=null; d.porFlag=false; delete S.errs.por; render(); return;
  }
  const ok = files.filter(x => x.size <= 20*1048576);
  if (ok.length < files.length) toast('Files must be 20 MB or smaller');
  if (!ok.length) return;
  if (kind==='img'){ if (!/^image\//.test(ok[0].type)) return toast('Use a PNG or JPG image'); d.img = URL.createObjectURL(ok[0]); d.imgUrl=''; d.imgErr=false; }
  if (kind==='docs') d.docs.push(...ok.map(x=>({name:x.name,size:x.size})));
  if (kind==='reviewFiles') d.reviewFiles.push(...ok.map(x=>({name:x.name,size:x.size})));
  render();
}
['dragover','dragleave','drop'].forEach(ev => document.addEventListener(ev, e => {
  const z = e.target.closest?.('[data-drop]'); if (!z) return;
  e.preventDefault(); z.classList.toggle('over', ev==='dragover');
  if (ev==='drop') takeFiles(z.dataset.drop, [...e.dataTransfer.files]);
}));
document.addEventListener('keydown', e => {
  if (e.key!=='Escape') return;
  if (S.modal && !S.signing){ closeModal(); render(); }
  else if (S.notifOpen || S.menu || S.tip){ S.notifOpen=false; S.menu=null; S.tip=false; render(); }
});

render();
</script>
</body>
