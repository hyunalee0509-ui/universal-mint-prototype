<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Universal Mint 리뷰 프로토타입</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,600;9..40,700&display=swap" rel="stylesheet">
<style>

:root {
  --bg-surface: #ffffff;
  --bg-surface-subtle: #f7f8fa;
  --bg-surface-muted: #ebedf0;
  --border-default: #e6e8eb;
  --border-strong: #d9d9d9;
  --brand-default: #004285;
  --brand-strong: #091d38;
  --brand-soft: #edf1f7;
  --altus-brand-soft: #edf3fd;
  --altus-brand-default: #073da8;
  --content-strong: #050d18;
  --content-muted: #5a6472;
  --content-faint: #b9bec4;
  --content-on-brand: #ffffff;
  --status-danger: #b31942;
  --status-danger-subtle: #fbe3e1;
  --status-warning: #9a6212;
  --status-warning-subtle: #fdf0d9;
  --status-info: #366dd7;
  --status-info-subtle: #e4eefb;
  --data-good: #0e7a5f;
  --data-warn: #cc780d;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: var(--bg-surface-muted); }
body {
  font-family: "DM Sans", system-ui, sans-serif;
  font-variation-settings: "opsz" 14;
  color: var(--content-strong);
  -webkit-font-smoothing: antialiased;
}
a, button { color: inherit; font: inherit; background: none; border: 0; cursor: pointer; text-align: left; text-decoration: none; }
img { display: block; }
.nowrap { white-space: nowrap; }


.app { display: flex; flex-direction: column; min-height: 100vh; }
.hdr { height: 62px; display: flex; align-items: center; gap: 16px; padding: 12px 20px; flex-shrink: 0; }
.hdr .brand { flex: 1; display: flex; align-items: center; gap: 8px; }
.hdr .brand img { width: 22px; height: 22px; }
.hdr .brand p { font-weight: 700; font-size: 16px; color: var(--brand-strong); white-space: nowrap; }
.hdr .tools { display: flex; align-items: center; gap: 12px; }
.hdr .bell { position: relative; width: 36px; height: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
.hdr .bell .unread { position: absolute; left: 24px; top: 6px; width: 7px; height: 7px; }
.hdr .divider { width: 1px; height: 24px; background: var(--border-strong); }
.hdr .account { display: flex; align-items: center; gap: 12px; }
.avatar { width: 32px; height: 32px; border-radius: 999px; background: var(--bg-surface-subtle); display: flex; align-items: center; justify-content: center; font-weight: 500; font-size: 12px; line-height: 1.45; color: var(--content-muted); }
.hdr .who p:first-child { font-weight: 600; font-size: 14px; line-height: 1.5; }
.hdr .who p:last-child { font-size: 12px; line-height: 1.45; color: var(--content-muted); }

.body { flex: 1; min-width: 0; display: flex; padding: 0 20px 20px; }
.panel { flex: 1; min-width: 0; min-height: calc(100vh - 82px); display: flex; align-items: stretch; background: var(--bg-surface-subtle); border: 1px solid var(--border-default); border-radius: 20px; overflow: hidden; }

.sb { width: 248px; flex-shrink: 0; border-right: 1px solid var(--border-default); display: flex; flex-direction: column; }
.sb .groups { flex: 1; display: flex; flex-direction: column; justify-content: space-between; padding: 12px 0; }
.sb .group { display: flex; flex-direction: column; gap: 4px; }
.sb .group.org { border-top: 1px solid var(--border-default); padding: 12px 0; }
.sb .glabel { padding: 6px 0 8px 28px; font-weight: 700; font-size: 11px; line-height: 1.3; letter-spacing: 0.55px; text-transform: uppercase; color: var(--content-faint); }
.sb .inset { padding: 0 12px; }
.nav { position: relative; display: flex; align-items: center; gap: 12px; height: 37px; padding: 8px 16px; border-radius: 10px; width: 100%; }
.nav img { width: 16px; height: 16px; flex-shrink: 0; }
.nav span { flex: 1; font-size: 14px; line-height: 1.5; color: var(--content-muted); }
.nav:hover { background: var(--bg-surface-muted); }
.nav.on { background: var(--bg-surface-muted); }
.nav.on span { font-weight: 600; color: var(--content-strong); }
.nav.on::before { content: ""; position: absolute; left: 0; top: 8px; width: 3px; height: 21px; border-radius: 6px; background: var(--brand-default); }
.count { min-width: 20px; height: 20px; padding: 0 4px; border-radius: 999px; background: var(--status-danger); color: var(--content-on-brand); font-weight: 500; font-size: 12px; line-height: 1.45; display: flex; align-items: center; justify-content: center; }
.sb .switch-wrap { padding: 8px 12px 12px; }
.switcher { width: 100%; display: flex; align-items: center; gap: 8px; padding: 12px; border: 1px solid var(--border-default); border-radius: 8px; }
.monogram { width: 28px; height: 28px; border-radius: 10px; background: var(--brand-default); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
.monogram img { width: 16px; height: 16px; }
.switcher .org { flex: 1; min-width: 0; font-size: 12px; line-height: 1.45; }
.switcher .org p { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.switcher .org p:first-child { font-weight: 500; }
.switcher .org p:last-child { color: var(--content-muted); }
.chev14 { width: 14px; height: 14px; flex-shrink: 0; }
.chev16 { width: 16px; height: 16px; flex-shrink: 0; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 24px; padding: 32px 32px 24px; }


.page-head { display: flex; flex-direction: column; gap: 12px; white-space: nowrap; }
.page-head h1 { font-weight: 700; font-size: 40px; line-height: 1.15; letter-spacing: -0.6px; }
.page-head p { font-size: 14px; line-height: 1.5; color: var(--content-muted); }

.card { background: var(--bg-surface); border: 1px solid var(--border-default); border-radius: 10px; overflow: hidden; width: 100%; display: flex; flex-direction: column; }
.card-head { display: flex; align-items: flex-start; justify-content: space-between; padding: 20px 24px 16px; }
.card-head.tight { padding-bottom: 12px; }
.eyebrow { font-weight: 600; font-size: 11px; letter-spacing: 0.44px; text-transform: uppercase; color: var(--content-muted); white-space: nowrap; }
.stat { display: flex; flex-direction: column; gap: 6px; white-space: nowrap; }
.stat .num { display: flex; align-items: baseline; gap: 10px; }
.stat .num b { font-weight: 500; font-size: 36px; }
.stat .num span { font-size: 13px; color: var(--content-muted); }
.link { height: 32px; font-weight: 500; font-size: 12px; color: var(--brand-default); white-space: nowrap; }
.link.auto { height: auto; }

.row { display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 24px; border-top: 1px solid var(--border-default); width: 100%; }
a.row:hover, button.row:hover { background: var(--bg-surface-subtle); }
.row .txt { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; white-space: nowrap; }
.row .txt p:first-child { font-weight: 500; font-size: 14px; }
.row .txt p:last-child { font-size: 12px; color: var(--content-muted); }
.row .big { font-weight: 500; font-size: 20px; white-space: nowrap; }

.thead { display: flex; align-items: center; gap: 12px; height: 36px; padding: 0 24px; border-top: 1px solid var(--border-default); font-weight: 600; font-size: 11px; text-transform: uppercase; color: var(--content-muted); }

.badge { height: 24px; padding: 0 12px; border-radius: 999px; display: inline-flex; align-items: center; font-size: 12px; line-height: 1.45; white-space: nowrap; flex-shrink: 0; }
.badge.warn { background: var(--status-warning-subtle); color: var(--status-warning); }
.badge.danger { background: var(--status-danger-subtle); color: var(--status-danger); }

.btn { height: 36px; padding: 0 16px; border-radius: 10px; display: inline-flex; align-items: center; justify-content: center; gap: 12px; font-weight: 500; font-size: 12px; line-height: 1.45; white-space: nowrap; flex-shrink: 0; }
.btn.secondary { background: var(--bg-surface); border: 1px solid var(--border-strong); color: var(--brand-default); }
.btn.secondary.dark { color: var(--content-strong); }
.btn.primary { background: var(--brand-default); color: var(--content-on-brand); }

.bar { width: 117px; height: 4px; border-radius: 2px; background: var(--border-default); overflow: hidden; flex-shrink: 0; }
.bar i { display: block; height: 4px; border-radius: 2px; }


.rv-tag { position: fixed; right: 16px; bottom: 16px; z-index: 50; display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 14px; border-radius: 999px; background: #1f2937; color: #fff; font-size: 13px; box-shadow: 0 4px 16px rgba(0,0,0,.2); max-width: calc(100vw - 32px); }
.rv-tag b { font-weight: 700; }
.rv-tag #rv-name { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; max-width: 320px; color: rgba(255,255,255,.8); }
.rv-tag #rv-figma { font-size: 11px; color: rgba(255,255,255,.5); padding: 4px 0; flex-shrink: 0; }
.rv-tag #rv-figma:hover { color: #fff; text-decoration: underline; }
.rv-tag .rv-sep { width: 1px; height: 16px; background: rgba(255,255,255,.2); flex-shrink: 0; }
.rv-tag #rv-open { height: 36px; padding: 0 20px; border-radius: 999px; background: #fff; color: #1f2937; font-size: 14px; font-weight: 600; flex-shrink: 0; margin-left: 6px; }
.rv-tag #rv-open:hover { background: #e5e7eb; }
.rv-toast { position: fixed; left: 50%; bottom: 64px; transform: translateX(-50%); z-index: 60; padding: 10px 16px; border-radius: 10px; background: #1f2937; color: #fff; font-size: 13px; max-width: 560px; display: none; }
.rv-toast.show { display: block; }
.rv-list { position: fixed; right: 16px; bottom: 68px; z-index: 55; width: 320px; max-height: 70vh; overflow: auto; background: #fff; border: 1px solid var(--border-default); border-radius: 12px; box-shadow: 0 8px 32px rgba(0,0,0,.16); padding: 8px; display: none; font-size: 13px; }
.rv-list.show { display: block; }
.rv-list h4 { font-size: 11px; text-transform: uppercase; color: var(--content-muted); padding: 8px 8px 4px; }
.rv-list a { display: flex; gap: 8px; padding: 6px 8px; border-radius: 6px; }
.rv-list a:hover { background: var(--bg-surface-subtle); }
.rv-list a b { width: 56px; flex-shrink: 0; }
.rv-list a.todo { color: var(--content-faint); }


@media (max-width: 900px) {
  .sb { display: none; }
  .body { padding: 0 8px 8px; }
  .main { padding: 20px 16px 48px; }
  .hdr .who { display: none; }
  .thead { display: none; }
  .page-head { white-space: normal; }
  .rv-tag #rv-name { display: none; }
}

.sb.obm .ob-nav { display: block; }

.h-setup .tx p:first-child { font-weight: 600; font-size: 16px; }
.h-setup .tx p:last-child { font-size: 13px; color: var(--content-muted); }
.h-setup .dismiss { width: 90px; height: 32px; display: flex; align-items: center; font-weight: 500; font-size: 13px; color: var(--brand-default); flex-shrink: 0; }
.h-closed { width: 100%; display: flex; align-items: center; justify-content: space-between; padding: 16px 20px; background: #fff8eb; border: 1px solid #f0c878; border-radius: 10px; white-space: nowrap; }
.h-closed .tx { display: flex; flex-direction: column; gap: 4px; }
.h-closed .tx p:first-child { font-weight: 600; font-size: 15px; }
.h-closed .tx p:last-child { font-size: 13px; color: var(--content-muted); }
.h-closed .exp { font-weight: 500; font-size: 14px; color: var(--brand-default); }
.h-dash { width: 160px; flex-shrink: 0; font-size: 14px; }

@media (max-width: 900px) {
  .h-cols { flex-direction: column; }
  .h-side { width: 100%; }
  .h-work { width: 100%; }
  .h-res, .h-dash { display: none; }
  .h-sup { width: auto; }
  .h-tasks { flex-wrap: wrap; white-space: normal; }
  .h-tasks .o { display: none; }
  .h-lr .cell:not(.end) { display: none; }
  .h-lr .cell.end { width: auto; }
  .h-closed { flex-direction: column; align-items: flex-start; gap: 8px; white-space: normal; }
  .h-setup .tx { white-space: normal; }
  .h-setup .dismiss { width: auto; }
  .h-error { white-space: normal; padding: 56px 16px 64px; }
}
@media (max-width: 1200px) and (min-width: 901px) {
  .h-cols { flex-direction: column; }
  .h-side, .h-work { width: 100%; }
}

const FIGMA = 'https://www.figma.com/design/AnRP8zHPMcjHE7sJJORa0d/?node-id=';

const PLAN = BUNDLE.plan;

const screens = {};
document.querySelectorAll('template[id^="s-"]').forEach(t => {
  const d = t.dataset;
  screens[t.id.slice(2)] = { name: d.name, nav: d.nav, node: d.node, overlay: d.overlay, tpl: t,
    user: d.user, badge: d.badge, homeicon: d.homeicon, layout: d.layout,
    sb: d.sb, locktip: d.locktip, obhome: d.obhome, base: d.base };
});
let current = null;
let openOv = null;

const $ = id => document.getElementById(id);
let toastTimer;
function toast(msg) {
  const el = $('rv-toast');
  el.textContent = msg; el.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => el.classList.remove('show'), 2600);
}

function setTag(code) {
  const s = screens[code];
  $('rv-code').textContent = code;
  $('rv-name').textContent = s.name;
  $('rv-figma').href = FIGMA + s.node.replace(':', '-');
}

function closeOverlay() {
  if (!openOv) return;
  $('ov').innerHTML = '';
  document.querySelector('.hdr .unread').style.visibility = '';
  openOv = null;
  if (current) setTag(current);
}
function openOverlay(code) {
  closeOverlay();
  const s = screens[code];
  const layer = $('ov');
  layer.appendChild(s.tpl.content.cloneNode(true));
  fillIcons(layer);
  openOv = code;
  placeOverlay();
  if (s.overlay === 'bell') document.querySelector('.hdr .unread').style.visibility = 'hidden';
  setTag(code);
}
function placeOverlay() {
  const pop = $('ov').querySelector('.pop');
  if (!pop) return;
  const kind = screens[openOv].overlay;
  if (kind === 'bell') {
    const r = document.querySelector('.hdr .bell').getBoundingClientRect();
    pop.style.left = (r.right + scrollX - pop.offsetWidth) + 'px';
    pop.style.top = (r.bottom + scrollY + 3) + 'px';
  } else if (kind === 'switcher') {
    const r = document.querySelector('.switcher').getBoundingClientRect();
    pop.style.left = (r.left + scrollX - 6) + 'px';
    pop.style.top = (r.top + scrollY - 10 - pop.offsetHeight) + 'px';
  }
}

const SHELL = { user: 'Juya Kim|juya.k@bharvest.io|JK', badge: '5' };
const homeIcon = document.querySelector('#sb [data-nav="home"] img');
const homeIconDefault = homeIcon.src;
function setShell(s) {
  const [name, mail, ini] = (s.user || SHELL.user).split('|');
  document.querySelector('.hdr .who p:first-child').textContent = name;
  document.querySelector('.hdr .who p:last-child').textContent = mail;
  document.querySelector('.hdr .avatar').textContent = ini;
  const badge = s.badge === undefined ? SHELL.badge : s.badge;
  const c = document.querySelector('#sb .count');
  c.textContent = badge; c.style.display = badge ? '' : 'none';
  homeIcon.src = (s.homeicon && ICONS[s.homeicon]) || homeIconDefault;
  const sb = $('sb');
  sb.classList.toggle('obm', !!s.sb);
  sb.querySelectorAll('.inset').forEach(i => {
    const k = i.querySelector('.nav').dataset.nav;
    const lk = s.sb === 'lock-all' ? (k !== 'onboarding' && k !== 'profile')
      : s.sb === 'lock-main' ? (!!i.closest('.groups') && k !== 'onboarding') : false;
    i.classList.toggle('lk', lk);
    if (lk && s.locktip) i.dataset.tip = s.locktip; else delete i.dataset.tip;
  });
  sb.querySelector('[data-nav="onboarding"]').dataset.go = s.obhome || current;
}

function fillIcons(root) { root.querySelectorAll('[data-i]').forEach(im => { im.src = ICONS[im.dataset.i]; }); }

function render(code) {
  const s = screens[code];
  if (!s || s.overlay) return false;
  closeOverlay();
  current = code;
  const bare = s.layout === 'bare';
  document.querySelector('.app').style.display = bare ? 'none' : '';
  const main = bare ? $('bare') : $('main');
  $('bare').innerHTML = ''; $('main').innerHTML = '';
  main.appendChild(s.tpl.content.cloneNode(true));
  fillIcons(main);
  if (!bare) {
    document.querySelectorAll('#sb .nav').forEach(n => n.classList.toggle('on', n.dataset.nav === s.nav));
    setShell(s);
  }
  setTag(code);
  window.scrollTo(0, 0);
  return true;
}

function go(code, el) {
  if (screens[code] && screens[code].overlay) {
    if (openOv === code) closeOverlay(); else openOverlay(code);
    return;
  }
  closeOverlay();
  if (code === 'back') { history.back(); return; }
  if (screens[code]) {
    if (location.hash !== '#' + code) location.hash = code; else render(code);
    if (el && el.dataset.note) toast(el.dataset.note);
    return;
  }
  if (OTHER[code]) { location.href = OTHER[code]; return; }
  toast(code + ': 이 프로토타입에 없는 화면');
}

document.addEventListener('click', e => {
  if (e.target.closest('[data-close]')) { e.preventDefault(); closeOverlay(); return; }
  const nf = e.target.closest('[data-nofigma]');
  if (nf) {
    e.preventDefault();
    if (nf.dataset.hide) { const t = nf.closest(nf.dataset.hide); if (t) t.remove(); }
    toast('Figma에 없음: ' + nf.dataset.nofigma);
    return;
  }
  const el = e.target.closest('[data-go]');
  if (!el) {
    if (openOv && !e.target.closest('.pop') && !e.target.closest('.rv-tag, .rv-list')) closeOverlay();
    return;
  }
  e.preventDefault();
  if (el.closest('.inset.lk')) return;
  go(el.dataset.go, el);
});

function buildList() {
  const box = $('rv-list');
  box.innerHTML = PLAN.map(([g, codes]) =>
    '<h4>' + g + '</h4>' + codes.map(c => {
      const s = screens[c];
      return '<a href="#' + c + '" class="' + (s ? '' : 'todo') + '"><b>' + c + '</b><span>' + (s ? s.name : '준비 중') + '</span></a>';
    }).join('')
  ).join('');
  box.addEventListener('click', e => {
    const a = e.target.closest('a');
    if (a && a.classList.contains('todo')) { e.preventDefault(); toast(a.querySelector('b').textContent + ': 이 프로토타입에 없는 화면'); }
    else if (a) {
      const c = a.querySelector('b').textContent;
      box.classList.remove('show');
      if (screens[c] && screens[c].overlay) { e.preventDefault(); openOverlay(c); }
    }
  });
}
$('rv-open').addEventListener('click', () => $('rv-list').classList.toggle('show'));

function route() {
  const code = location.hash.slice(1);
  if (screens[code] && screens[code].overlay) { if (!current || screens[code].base) render(screens[code].base || BUNDLE.start); openOverlay(code); return; }
  render(code) || render(BUNDLE.start);
}
window.addEventListener('hashchange', route);
window.addEventListener('resize', placeOverlay);
document.addEventListener('keydown', e => { if (e.key === 'Escape') closeOverlay(); });
buildList();
route();

</script>
</body>
</html>
